      // A task of its own (Event Attribute, Collateral, ...) gets its own box too, edged in its type's colour
      if (!t.workMonth) return `<div class="brief-section solo-section solo-${typeKind(t.type)}">${taskCard(t)}</div>`;
      const key = t.workMonth + "|" + t.channel;
      if (shown.has(key)) return "";
      shown.add(key);
      const list = items.filter(o => o.workMonth === t.workMonth && o.channel === t.channel)
        .sort((a, b) => (a.stage === "done") - (b.stage === "done") || isVideoType(a.type) - isVideoType(b.type) || a.type.localeCompare(b.type));
      const link = (list.find(o => o.briefLink) || {}).briefLink;
      const finished = list.filter(o => o.stage === "done").length;
      return `<div class="brief-section${finished === list.length ? " brief-done" : ""}">
        <div class="brief-head">
          <span class="chan chan-${t.channel.toLowerCase()}">${escapeHtml(t.channel)}</span>
          <strong>${escapeHtml(t.forMonth ? monthLabel(t.forMonth) : monthLabel(t.workMonth))}</strong>
          <span class="muted">brief written in ${escapeHtml(monthLabel(t.workMonth).toLowerCase().replace(/^./, c => c.toUpperCase()))}</span>
          ${link ? `<a class="tag tag-link" href="${safeHref(link)}" target="_blank" rel="noopener">📄 Brief ${escapeHtml(t.channel)} ↗</a>` : ""}
          <span class="brief-count">${finished === list.length ? "✓ All done" : `${finished}/${list.length} done`}</span>
        </div>
        ${list.map(taskCard).join("")}
      </div>`;
    }).join("");
  }

  /* ---------- Sidebar: my projects ---------- */
  // Each project with its active tasks, and a dot when something in it is my turn. Opens Milestones on it.
  // Milestones itself is every project, so only one of them is marked at a time.
  function renderSideProjects() {
    const current = state.page === "tasks" ? $("tProject").value : null;
    $("tabTasks").classList.toggle("active", current === "");
    const active = list => list.filter(t => t.stage !== "done").length;
    const item = (p, label, icon, list) => {
      const mine = list.filter(isMyStep).length;
      return `<button type="button" class="side-project${current === p ? " active" : ""}" data-project="${escapeHtml(p)}" title="${escapeHtml(label)}">
        <span class="side-icon">${icon}</span><span class="nav-label">${escapeHtml(label)}</span>
        ${mine ? `<span class="turn-dot" title="${plural(mine, "task")} waiting for you"></span>` : ""}<span class="nav-count">${active(list)}</span></button>`;
    };
    $("sideProjects").innerHTML = taskProjects().map(p => item(p, p, projectIcon(p), state.tasks.filter(t => t.project === p))).join("");
    const turn = state.tasks.filter(isMyStep).length;
    $("navTurn").hidden = !turn;
    $("navTurn").textContent = turn;
  }
  function showProject(p) {
    resetTaskFilters(false);
    $("tProject").value = p;
    showView("tasks");
  }
  // The Milestones button: every project again (the other filters stay)
  function openMilestones() {
    $("tProject").value = "";
    showView("tasks");
  }

  /* ---------- Home ---------- */
  // The stages a task goes through, as columns of the Projects table (each opens Milestones on that group)
  const STAGE_COLUMNS = [
    { key: "drafting", name: "Brief" }, { key: "qc", name: "QC Internal" }, { key: "production", name: "Production" },
    { key: "client", name: "At client" }, { key: "ready", name: "Ready to post" },
  ];
  function timeAgo(iso) {
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    return m < 60 ? `${Math.max(1, m)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : m < 2880 ? "yesterday" : `${Math.round(m / 1440)}d ago`;
  }
  const RECENT_WORDS = { revision: "asked for a revision", approved: "approved", assign: "passed on" };
  // "Good night" is said when leaving, so the evening greeting lasts until the morning
  const dayPart = hour => hour >= 4 && hour < 11 ? "morning" : hour >= 11 && hour < 15 ? "afternoon" : "evening";
  // "VTB, KRR and GTR"
  const listWords = words => words.length < 2 ? words.join("") : words.slice(0, -1).join(", ") + " and " + words[words.length - 1];

  function renderHome() {
    if (!state.loaded) return;
    const u = me(), owner = u.role === "owner";
    const byDeadline = (a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999");
    const late = t => t.stage !== "done" && !!t.deadline && t.deadline < today();
    const active = state.tasks.filter(t => t.stage !== "done");
    const projects = taskProjects();

    $("helloTitle").textContent = `Good ${dayPart(new Date().getHours())}, ${u.name}`;
    // "Content Writer · VTB, KRR, Makuta and GTR" (the owner's role name is the name itself)
    $("helloText").textContent = `${owner ? "Owner" : u.roleName} · ${u.all ? "every project" : listWords(u.projects)}`;

    // Four numbers that answer "what should I look at?"; each opens the matching list in Milestones
    const soon = active.filter(STEP_GROUPS.soon.test).sort(byDeadline);
    const stats = [
      owner ? { n: active.length, label: "Active tasks", note: "In every project", stat: "active" }
        : { n: active.filter(isMyStep).length, label: "Waiting for you", note: "At a step you handle", stat: "mine", tone: "accent" },
      { n: active.filter(late).length, label: "Late", note: "Past their deadline", stat: "late", tone: "danger" },
      { n: soon.length, label: "Due this week", note: "Deadline in the next 7 days", stat: "soon" },
      { n: active.filter(STEP_GROUPS.client.test).length, label: "At client", note: "Sent, waiting for the client", stat: "client" },
    ];
    $("homeStats").innerHTML = stats.map(s => `<button type="button" class="home-stat${s.n && s.tone ? " tone-" + s.tone : ""}" data-stat="${s.stat}">
        <span class="stat-n">${s.n}</span><span class="stat-label">${s.label}</span><span class="stat-note">${s.note}</span></button>`).join("");

    // Waiting for you: the steps I am responsible for. The owner has none, so they see what is late.
    // Monthly Brief tasks that one button moves together are listed once ("Static + Video" on the button)
    const turn = active.filter(t => owner ? late(t) : isMyStep(t)).sort(byDeadline)
      .filter((t, i, list) => !list.slice(0, i).some(o => linkedTasks(o).includes(t)));
    $("turnTitle").textContent = owner ? "Late tasks" : "Waiting for you";
    $("turnCount").textContent = turn.length ? plural(turn.length, "task") : "";
    $("turnNote").textContent = owner ? "Tasks past their deadline, with who they are waiting for."
      : "Press the button when your step is done. The task then moves on to the next person.";
    $("homeTurn").innerHTML = turn.length ? turn.map(t => `<div class="turn-row${late(t) ? " is-late" : ""}">
        <button type="button" class="turn-open" data-open="${escapeHtml(t.id)}" title="Open in Milestones">
          <span class="turn-title">${escapeHtml(t.title)}</span>
          <span class="turn-meta">${projectIcon(t.project)} ${escapeHtml(t.project)} · Step: <b>${escapeHtml(stageOf(t.stage).name)}</b>${owner ? ` · Waiting for ${escapeHtml(waitingFor(t))}` : ""}</span>
          ${taskDue(t)}
        </button>
        <div class="turn-actions">${stepButtons(t)}</div>
      </div>`).join("")
      : `<div class="turn-empty">${owner ? "Nothing is late. 🎉" : "Nothing is waiting for you right now. Every task in your projects is with someone else."}</div>`;

    // Projects: active tasks per stage
    const cell = (list, key, p) => {
      const n = list.filter(STEP_GROUPS[key].test).length;
      return n ? `<button type="button" class="stage-n${key === "late" ? " is-late" : ""}" data-stat="${key}" data-project="${escapeHtml(p)}">${n}</button>` : `<span class="stage-n is-zero">0</span>`;
    };
    $("homeProjects").innerHTML = projects.length ? `<div class="proj-table" role="table">
        <div class="proj-row proj-head" role="row"><span role="columnheader">Project</span>${STAGE_COLUMNS.map(c => `<span role="columnheader">${c.name}</span>`).join("")}<span role="columnheader">Late</span></div>
        ${projects.map(p => {
          const list = active.filter(t => t.project === p);
          return `<div class="proj-row" role="row">
            <button type="button" class="proj-name" data-project-open="${escapeHtml(p)}">${projectIcon(p)} ${escapeHtml(p)}<small>${plural(list.length, "active task")}</small></button>
            ${STAGE_COLUMNS.map(c => `<span class="proj-cell" data-label="${c.name}">${cell(list, c.key, p)}</span>`).join("")}
            <span class="proj-cell" data-label="Late">${cell(list, "late", p)}</span>
          </div>`;
        }).join("")}
      </div>` : `<p class="home-empty">No projects yet.</p>`;

    // Due soon (soonest first), with who has to act
    $("homeDue").innerHTML = soon.length ? `<ul class="home-list">${soon.slice(0, 8).map(t => `<li><button type="button" data-open="${escapeHtml(t.id)}">
        <span class="home-item">${escapeHtml(t.title)}</span>
        <span class="home-sub">${taskDue(t)} ${escapeHtml(stageOf(t.stage).name)} · ${escapeHtml(waitingFor(t))}</span></button></li>`).join("")}</ul>`
      : `<p class="home-empty">No deadlines in the next 7 days.</p>`;
    // The latest moves in my projects, newest first
    const recent = state.tasks.flatMap(t => t.history.filter(e => e.action !== "created").map(e => ({ t, e })))
      .sort((a, b) => b.e.at.localeCompare(a.e.at)).slice(0, 8);
    $("homeRecent").innerHTML = recent.length ? `<ul class="home-list">${recent.map(({ t, e }) => `<li><button type="button" data-open="${escapeHtml(t.id)}">
        <span class="home-item"><b>${escapeHtml(e.by || "Someone")}</b> ${escapeHtml(RECENT_WORDS[e.action] || "finished " + stageOf(e.from).name)}</span>
        <span class="home-sub">${escapeHtml(t.title)} · ${timeAgo(e.at)}</span></button></li>`).join("")}</ul>`
      : `<p class="home-empty">Nothing has moved yet.</p>`;
  }

  // Opens Milestones on one task: its project, every step, scrolled to it and highlighted once
  function openTask(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    resetTaskFilters(false);
    $("tProject").value = t.project;
    $("tStep").value = "all";
    showView("tasks");
    const card = document.querySelector(`#taskResults [data-task="${CSS.escape(id)}"]`);
    if (!card) return;
    card.scrollIntoView({ block: "center" });
    card.classList.remove("task-flash");
    void card.offsetWidth;
    card.classList.add("task-flash");
  }

  function handleHomeClick(e) {
    const open = e.target.closest("[data-open]");
    if (open) return openTask(open.dataset.open);
    const stat = e.target.closest("[data-stat]");
    if (stat) return applyTaskStat(stat.dataset.stat, stat.dataset.project || "");
    const proj = e.target.closest("[data-project-open]");
    if (proj) return showProject(proj.dataset.projectOpen);
    handleTaskAction(e);
  }

  /* ---------- Milestones: actions ---------- */
  // The pressed button spins right away, so it is clear the step is being saved
  function moveTask(t, action, opts, btn) {
    if (btn) { btn.disabled = true; btn.classList.add("is-busy"); }
    return api("moveTask", t.id, action, Object.assign({ from: t.stage }, opts))
      .then(saved => {
        // Monthly Brief tasks that moved together with this one
        const linked = saved.linked || [];
        delete saved.linked;
        linked.forEach(o => {
          const i = state.tasks.findIndex(x => x.id === o.id);
          if (i >= 0) state.tasks[i] = o; else state.tasks.push(o);
        });
        state.justMoved = saved.id;
        upsertTask(saved);
        state.justMoved = null;
        const msg = saved.stage === "done" ? `"${saved.title}" is done 🎉`
          : `${linked.length ? plural(linked.length + 1, "task") + " moved" : "Moved"} to "${stageOf(saved.stage).name}"`;
        // Undo right from the message (no need to look for the task again)
        if (action === "undo") toast(msg);
        else toast(msg, false, { label: "Undo", run: () => moveTask(state.tasks.find(x => x.id === saved.id), "undo", {}) });
        return true;
      })
      .catch(err => {
        if (btn) { btn.disabled = false; btn.classList.remove("is-busy"); }
        toast(err.message, true);
        return false;
      });
  }

  function openRevise(t) {
    // Monthly Brief: one QC for the month's ORG and ADS briefs, each can be sent back on its own
    const group = t.stage === "qcBrief" ? [t].concat(linkedTasks(t)) : [];
    const channels = Object.keys(state.cfg.channels).filter(c => group.some(o => o.channel === c));
    $("reviseChannelsField").hidden = !t.workMonth || !channels.length;
    if (t.workMonth && channels.length) {
      $("reviseToField").hidden = true;
      $("reviseText").textContent = `${t.project} briefs written in ${monthLabel(t.workMonth)}. The brief(s) you tick go back to ${projectWriter(t)}; after the fix they come straight back to QC.`;
      $("reviseChannels").innerHTML = channels.map(c => `<label class="check-item"><input type="checkbox" value="${c}"${channels.length === 1 || c === t.channel ? " checked" : ""}>
        <span class="chan chan-${c.toLowerCase()}">${c}</span> ${escapeHtml(group.filter(o => o.channel === c).map(o => typeShort(o.type)).join(" + "))}</label>`).join("");
      $("reviseNote").value = "";
      $("reviseOk").disabled = false;
      $("reviseOk").onclick = () => {
        const picked = [...document.querySelectorAll("#reviseChannels input:checked")].map(i => i.value);
        if (!picked.length) return toast("Tick the brief that needs a revision.", true);
        moveTask(t, "revise", { channels: picked, note: $("reviseNote").value }, $("reviseOk")).then(ok => ok && closeModal("reviseModal"));
      };
      return openModal("reviseModal");
    }
    const i = t.steps.indexOf(t.stage);
    // Revisions go back to the people who make the work (not to QC or to sending)
    const targets = t.steps.slice(0, i).filter(k => !stageOf(k).qc && k !== "toClient");
    // QC Client always sends the revision back to the content writer, who then passes it on
    const fromClient = t.stage === "qcClient";
    $("reviseToField").hidden = fromClient;
    $("reviseText").textContent = fromClient
      ? `"${t.title}": the client's revision goes back to ${projectWriter(t)} first, who then sends it to ${fixSteps(t).includes("video") ? "the videographer (CTC) or the graphic designer" : "the graphic designer"}. After the fix it goes through QC Internal again, then Kak Faza sends it to the client.`
      : `"${t.title}" at ${stageOf(t.stage).name}. Which step has to fix it? After the fix, it goes straight back to QC.`;
    $("reviseTo").innerHTML = targets.map(k => `<option value="${k}">${escapeHtml(stageOf(k).name)} (${escapeHtml(stageOwner(stageOf(k), t))})</option>`).join("");
    $("reviseTo").value = targets[targets.length - 1];
    $("reviseNote").value = "";
    $("reviseOk").disabled = false;
    $("reviseOk").onclick = () => moveTask(t, "revise", { to: $("reviseTo").value, note: $("reviseNote").value }, $("reviseOk"))
      .then(ok => ok && closeModal("reviseModal"));
    openModal("reviseModal");
  }

  // Drafting Brief, Design and Motion hand on a link: asked for when the step is pressed (the last one is
  // filled in, so after a revision only a changed link has to be pasted)
  function openStepLink(t) {
    const field = state.cfg.linkSteps[t.stage], brief = field === "briefLink", s = stageOf(t.stage);
    const together = togetherLabel(t);
    $("stepLinkTitle").textContent = s.action;
    $("stepLinkLabel").innerHTML = `${brief ? "Brief link" : "Result link"} <span class="req">*</span>`;
    $("stepLinkText").textContent = brief
      ? `"${t.title}"${together ? ` (one brief for ${together})` : ""}: paste the link to the brief. QC Internal opens it right from Milestones.`
      : `"${t.title}": paste the link to the finished ${isVideoType(t.type) ? "video" : "design"}. QC Internal, ${state.cfg.assistantName} and whoever posts it open it right from Milestones.`;
    $("stepLinkInput").value = t[field] || "";
    $("stepLinkErr").hidden = true;
    $("stepLinkOk").textContent = s.action;
    $("stepLinkOk").disabled = false;
    state.stepLinkTask = t.id;
    openModal("stepLinkModal");
    setTimeout(() => $("stepLinkInput").focus(), 50);
  }
  async function submitStepLink(e) {
    e.preventDefault();
    const t = state.tasks.find(x => x.id === state.stepLinkTask);
    if (!t) return closeModal("stepLinkModal");
    const link = normalizeUrl($("stepLinkInput").value);
    $("stepLinkErr").hidden = isValidUrl(link);
    if (!isValidUrl(link)) return $("stepLinkInput").focus();
    if (await moveTask(t, "advance", { link }, $("stepLinkOk"))) closeModal("stepLinkModal");
  }

  function toggleTaskItem(e) {
    const box = e.target;
    if (!box.matches("[data-titem]")) return;
    const t = state.tasks.find(x => x.id === box.dataset.id);
    if (!t) return;
    box.disabled = true;
    api("setTaskItem", t.id, box.dataset.titem, box.checked)
      .then(saved => {
        state.justTicked = box.checked ? `${saved.id}|${box.dataset.titem}` : null;
        upsertTask(saved);
        state.justTicked = null;
      })
      .catch(err => {
        box.checked = !box.checked;
        box.disabled = false;
        toast(err.message, true);
      });
  }

  async function handleTaskAction(e) {
    const btn = e.target.closest("[data-tact]");
    if (!btn) return;
    const t = state.tasks.find(x => x.id === btn.dataset.id);
    if (!t) return;
    const act = btn.dataset.tact;
    if (act === "advance") state.cfg.linkSteps[t.stage] ? openStepLink(t) : moveTask(t, "advance", {}, btn);
    else if (act === "assign") moveTask(t, "assign", { to: btn.dataset.to }, btn);
    else if (act === "revise") openRevise(t);
    else if (act === "edit") openTaskForm(t);
    else if (act === "undo") {
      const last = t.history[t.history.length - 1];
      // A step made together with other Monthly Brief tasks is taken back for all of them
      const together = last.sync ? state.tasks.filter(o => o !== t && o.history.length > 1 && o.history[o.history.length - 1].sync === last.sync).length : 0;
      if (await confirmDialog({ emoji: "↩️", title: "Undo the last step?", ok: "Undo",
        message: `"${t.title}" goes back to "${stageOf(last.from).name}".${together ? ` ${plural(together, "other task")} that moved with it ${together === 1 ? "goes" : "go"} back too.` : ""}` })) moveTask(t, "undo", {}, btn);
    } else if (act === "delete" && await confirmDialog({ message: `"${t.title}" and its timeline will be permanently removed, including from the Google Sheet.` })) {
      try {
        await api("deleteTask", t.id);
        state.tasks = state.tasks.filter(x => x.id !== t.id);
        refreshTaskProjects();
        renderTasks();
        toast("Task deleted");
      } catch (err) {
        toast("Delete failed: " + err.message, true);
      }
    }
  }

  /* ---------- Admin (owner only): who is logged in, activity, View as ---------- */
  async function loadAdmin() {
    if (!state.user || state.user.role !== "owner") return;
    try {
      state.admin = await api("getAdminData");
    } catch (err) {
      $("adminSessions").innerHTML = `<div class="empty">Could not load: ${escapeHtml(err.message)}</div>`;
      return;
    }
    const a = state.admin;
    const pick = $("viewAsUser").value;
    $("viewAsUser").innerHTML = a.users.map(u => `<option value="${escapeHtml(u.username)}">${escapeHtml(u.name)} · ${escapeHtml(u.role)}</option>`).join("");
    if (pick) $("viewAsUser").value = pick;
    $("adminSessions").innerHTML = a.sessions.length ? `<ul class="admin-list">${a.sessions.map(s => `<li>
        <span><b>${escapeHtml(s.name)}</b> <span class="muted">${s.role && s.role !== s.name ? escapeHtml(s.role) + " · " : ""}${escapeHtml(s.device || "Unknown device")}</span><br>
        <span class="muted">Logged in ${formatDate(s.start)} · last active ${formatDate(s.seen)}</span></span>
        ${s.self ? `<span class="tag">This browser</span>` : `<button type="button" class="btn-danger btn-sm" data-session="${escapeHtml(s.id)}">Log out</button>`}
      </li>`).join("")}</ul>` : `<div class="empty">Nobody is logged in.</div>`;
    fillSelect("actWho", [...new Set(a.activity.map(e => e.who).filter(Boolean))].sort(), "Everyone");
    fillSelect("actProject", [...new Set(a.activity.map(e => e.project).filter(Boolean))].sort(), "All projects");
    renderActivity();
  }

  function renderActivity() {
    const who = $("actWho").value, project = $("actProject").value;
    const list = ((state.admin || {}).activity || []).filter(e => (!who || e.who === who) && (!project || e.project === project));
    $("adminActivity").innerHTML = list.length ? `<ul class="admin-list">${list.map(e => `<li>
        <span class="act-when">${formatDate(e.at)}</span>
        <span class="act-main"><b>${escapeHtml(e.who)}</b> · ${escapeHtml(e.action)}${e.task ? ` · ${escapeHtml(e.task)}` : ""}${e.project ? ` <span class="muted">(${escapeHtml(e.project)})</span>` : ""}
          ${e.details ? `<span class="act-details">${escapeHtml(e.details)}</span>` : ""}</span>
      </li>`).join("")}</ul>` : `<div class="empty">No activity yet.</div>`;
  }

  async function endSessions(ids) {
    const all = ids === "all";
    if (!await confirmDialog({ emoji: "🔐", title: all ? "Log out everyone else?" : "Log out this session?", ok: "Log out",
      message: all ? "Everyone except you has to log in again." : "That browser has to log in again." })) return;
    try {
      const n = await api("endSessions", ids);
      toast(`${plural(n, "session")} ended`);
      loadAdmin();
    } catch (err) {
      toast(err.message, true);
    }
  }

  // View as: the app is loaded again as that account, read-only, until Exit
  function startViewAs() {
    const username = $("viewAsUser").value;
    if (!username) return;
    state.viewAs = username;
    showView("tasks");
    loadData();
  }
  function exitViewAs() {
    state.viewAs = "";
    loadData().then(() => showView("admin"));
  }

  /* ---------- Init ---------- */
  toggleSideCollapse(document.documentElement.classList.contains("side-collapsed"));
  $("linkForm").addEventListener("submit", submitForm);
  $("url").addEventListener("input", () => { checkDuplicate(); guessCategory(); });
  $("category").addEventListener("change", updateCategoryFields);
  $("videoSource").addEventListener("change", () => showError("videoSource", false));
  ["search", "fCategory", "fProject", "sort", "pinnedOnly"].forEach(id => $(id).addEventListener("input", render));
  document.querySelectorAll("[data-ltab]").forEach(b => b.addEventListener("click", () => showLinkTab(b.dataset.ltab)));
  $("stepLinkForm").addEventListener("submit", submitStepLink);
  $("results").addEventListener("click", handleAction);
  $("taskResults").addEventListener("click", handleTaskAction);
  $("viewHome").addEventListener("click", handleHomeClick);
  $("sideProjects").addEventListener("click", e => {
    const b = e.target.closest("[data-project]");
    if (b) showProject(b.dataset.project);
  });
  // The New menu closes on any click outside it
  document.addEventListener("click", e => {
    if (!$("newMenu").hidden && !e.target.closest(".new-wrap, .bottom-new")) toggleNewMenu(false);
  });
  $("taskResults").addEventListener("change", toggleTaskItem);
  // Remember which History panels are open, so they stay open when the list is redrawn
  $("taskResults").addEventListener("toggle", e => {
    if (!e.target.matches("details.history")) return;
    state.openHistory[e.target.open ? "add" : "delete"](e.target.dataset.id);
  }, true);
  $("taskForm").addEventListener("submit", submitTaskForm);
  $("tfType").addEventListener("change", updateTaskForm);
  $("tfItem").addEventListener("change", updateTaskForm);
  $("tfDeadline").addEventListener("input", updateTaskForm);
  $("tfTitle").addEventListener("input", onTaskTitleInput);
  $("tfProject").addEventListener("change", () => {
    $("tfProject").dataset.auto = "";
    fillTaskTypes();
    updateTaskForm();
  });
  $("batchForm").addEventListener("submit", submitBatchForm);
  $("bfProject").addEventListener("change", renderBatchRows);
  $("bfMonth").addEventListener("input", renderBatchRows);
  $("bfRows").addEventListener("change", updateBatchForm);
  // The shared deadline fills every task (each one can still be changed after)
  $("bfDeadline").addEventListener("input", () => document.querySelectorAll("#bfRows [data-bdeadline]").forEach(i => i.value = $("bfDeadline").value));
  ["tSearch", "tProject", "tMonth", "tStep"].forEach(id => $(id).addEventListener("input", renderTasks));
  $("sheetLink").addEventListener("click", e => {
    if (state.app.sheetUrl) return;
    e.preventDefault();
    toast(state.loaded ? "The Google Sheet link isn't available here." : "Still loading, please try again in a moment.", true);
  });
  document.querySelectorAll(".segmented button").forEach(btn => btn.addEventListener("click", () => {
    state.view = btn.dataset.view;
    document.querySelectorAll(".segmented button").forEach(b => b.classList.toggle("active", b === btn));
    render();
  }));

  $("adminSessions").addEventListener("click", e => {
    const btn = e.target.closest("[data-session]");
    if (btn) endSessions([btn.dataset.session]);
  });
  ["actWho", "actProject"].forEach(id => $(id).addEventListener("input", renderActivity));

  $("lockForm").addEventListener("submit", unlock);
  if (ticket) loadData(); else showLock();
</script>
