<script>
  const REFERENCE_PROJECT = "REFERENCE";
  const CATEGORY_ICONS = { "Google Docs": "📄", "Google Spreadsheets": "📈", "Google Slide": "📊", "Drive Folder": "📁", "CTC-Video": "🎬", "Reference": "🔖", "Other": "📌" };
  const $ = id => document.getElementById(id);
  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");
  // "CTC-Video [VG-Arif]" -> { base: "CTC-Video", source: "VG-Arif" }
  function splitCategory(c) {
    const m = String(c).match(/^(CTC-Video) \[(.+)\]$/);
    return m ? { base: m[1], source: m[2] } : { base: c, source: "" };
  }
  const categoryLabel = c => `${CATEGORY_ICONS[splitCategory(c).base] || "📌"} ${c}`;
  const state = { links: [], tasks: [], cfg: null, app: {}, user: null, viewAs: "", loaded: false, editingId: null, dupId: null, view: "table", linkTab: "resources", editingTaskId: null, stepLinkTask: null, openHistory: new Set(), justMoved: null, justTicked: null, page: "home" };

  const SORTERS = {
    newest: (a, b) => b.createdAt.localeCompare(a.createdAt),
    oldest: (a, b) => a.createdAt.localeCompare(b.createdAt),
    az: (a, b) => a.title.localeCompare(b.title),
    za: (a, b) => b.title.localeCompare(a.title),
  };

  /* ---------- Server calls (each one carries this browser's login ticket) ---------- */
  const TICKET_KEY = "makutaTicket";
  let ticket = "";
  try {
    ticket = localStorage.getItem(TICKET_KEY) || "";
    localStorage.removeItem("makutaPasscode");  // the passcode used before logins existed
  } catch (e) {}

  // Errors starting with "LOCKED:" (not logged in, login ended, wrong password) show the login screen
  function callServer(fn, ...args) {
    return new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(err => {
        const locked = String(err && err.message).match(/LOCKED:\s*(.*)$/);
        if (locked) showLock(locked[1]);
        reject(locked ? new Error("Locked: " + locked[1]) : err);
      })[fn](...args));
  }
  // While the owner uses View as, every call reads the app as that account (the server refuses changes)
  const api = (fn, ...args) => callServer("api", ticket, fn, args, state.viewAs || "");

  /* ---------- Login screen ---------- */
  function showLock(message) {
    state.loaded = false;
    $("lockErr").textContent = message || "";
    $("lockErr").hidden = !message;
    $("lockInput").value = "";
    togglePasscode(false);
    document.querySelectorAll(".modal-bg.show").forEach(m => m.classList.remove("show"));
    openModal("lockModal");
    // Unless someone already started typing in it
    setTimeout(() => $("lockModal").contains(document.activeElement) || ($("lockUser").value ? $("lockInput") : $("lockUser")).focus(), 50);
  }

  // Eye button: show the password to check for typos, click again to hide it
  function togglePasscode(show) {
    show = typeof show === "boolean" ? show : $("lockInput").type === "password";
    $("lockInput").type = show ? "text" : "password";
    $("lockEye").classList.toggle("on", show);
    $("lockEye").title = show ? "Hide password" : "Show password";
    $("lockEye").setAttribute("aria-label", $("lockEye").title);
    $("lockEye").setAttribute("aria-pressed", String(show));
    $("lockInput").focus();
  }

  // The browser and system, so the owner can tell sessions apart, e.g. "Chrome · Windows"
  function deviceName() {
    const ua = navigator.userAgent;
    const browser = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "Browser";
    const system = /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iOS" : /Windows/.test(ua) ? "Windows" : /Mac OS/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "";
    return system ? `${browser} · ${system}` : browser;
  }

  async function unlock(e) {
    e.preventDefault();
    // A space typed or pasted before / after the password (phone keyboards add one) is not part of it
    const username = $("lockUser").value.trim(), password = $("lockInput").value.trim();
    if (!username || !password) return ($("lockErr").textContent = "Fill in your username and password.", $("lockErr").hidden = false);
    $("lockBtn").disabled = true;
    try {
      // The login answer already holds everything the page shows (one call instead of two)
      const res = await callServer("login", username, password, deviceName());
      ticket = res.ticket;
      try { localStorage.setItem(TICKET_KEY, ticket); } catch (err) {}
      closeModal("lockModal");
      useData(res.data);
      // Every login starts on Home (not on the page the previous account left open)
      showView("home");
    } catch (err) {
      // showLock already shows the reason (wrong password, account locked)
      if (!/^Locked:/.test(err.message)) showLock(err.message);
    } finally {
      $("lockBtn").disabled = false;
    }
  }

  // Ends the login on this browser (e.g. on a shared computer)
  async function lockApp() {
    try { await api("logout"); } catch (e) {}
    forgetLogin();
  }
  function forgetLogin() {
    ticket = "";
    try { localStorage.removeItem(TICKET_KEY); } catch (e) {}
    state.links = [];
    state.tasks = [];
    state.user = null;
    state.viewAs = "";
    $("results").innerHTML = $("taskResults").innerHTML = "";
    $("lockUser").value = "";
    showLock();
  }

  /* ---------- Helpers ---------- */
  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const pad = n => String(n).padStart(2, "0");
  const dayStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => dayStr(new Date());
  const parseDay = day => { const [y, m, d] = day.split("-").map(Number); return new Date(y, m - 1, d); };
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

  function formatDate(iso) {
    const d = new Date(iso);
    return !iso || isNaN(d) ? "-" : d.toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  // Local "yyyy-mm-dd" of when a link was added ("" if the date is missing/invalid)
  function addedDay(l) {
    const d = new Date(l.createdAt);
    return !l.createdAt || isNaN(d) ? "" : dayStr(d);
  }
  function formatDay(day) {
    return parseDay(day).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }
  function daysUntil(day) {
    const now = new Date();
    return Math.round((parseDay(day) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  }

  // Add https:// when the protocol is missing
  function normalizeUrl(url) {
    url = url.trim();
    if (url && !/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;
    return url;
  }
  function isValidUrl(url) {
    if (!/^https?:\/\/[^\s/.]+\.[^\s/]+\S*$/i.test(url)) return false;
    try { return ["http:", "https:"].includes(new URL(url).protocol); } catch (e) { return false; }
  }
  // Only http(s) links are clickable (protects against odd values typed into the sheet)
  const safeHref = url => /^https?:\/\//i.test(url) ? escapeHtml(url) : "#";
  // Comparable form of a URL, so ".../edit?usp=sharing" and ".../view" count as the same link
  function urlKey(url) {
    try {
      const u = new URL(normalizeUrl(url));
      [...u.searchParams.keys()].forEach(k => { if (k === "usp" || k.startsWith("utm_")) u.searchParams.delete(k); });
      const path = u.pathname.replace(/\/(edit|view|preview)$/i, "").replace(/\/+$/, "");
      return (u.hostname.replace(/^www\./, "") + path + u.search).toLowerCase();
    } catch (e) { return ""; }
  }

  function toggleTheme() {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("makutaTheme", next); } catch (e) {}
  }

  // action: an optional button in the message, e.g. { label: "Undo", run } (the message then stays longer)
  function toast(msg, isError, action) {
    const el = $("toast");
    el.textContent = (isError ? "⚠️ " : "✅ ") + msg;
    if (action) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "toast-action";
      b.textContent = action.label;
      b.onclick = () => { el.classList.remove("show"); action.run(); };
      el.appendChild(b);
    }
    el.classList.toggle("error", !!isError);
    el.classList.toggle("has-action", !!action);
    el.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove("show"), action ? 6000 : isError ? 4000 : 2000);
  }

  /* ---------- Modals ---------- */
  function openModal(id) { $(id).classList.add("show"); }
  function closeModal(id) { $(id).classList.remove("show"); }

  function confirmDialog({ emoji = "🗑️", title = "Delete this link?", message = "", ok = "Delete" } = {}) {
    return new Promise(resolve => {
      $("confirmEmoji").textContent = emoji;
      $("confirmTitle").textContent = title;
      $("confirmText").textContent = message;
      $("confirmOk").textContent = ok;
      openModal("confirmModal");
      const done = result => {
        closeModal("confirmModal");
        $("confirmOk").onclick = $("confirmCancel").onclick = null;
        resolve(result);
      };
      $("confirmOk").onclick = () => done(true);
      $("confirmCancel").onclick = () => done(false);
    });
  }

  document.querySelectorAll(".modal-bg").forEach(bg => bg.addEventListener("click", e => {
    if (e.target !== bg) return;
    if (bg.id === "lockModal") return;
    if (bg.id === "confirmModal") $("confirmCancel").click(); else closeModal(bg.id);
  }));
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    const open = document.querySelector(".modal-bg.show");
    // Without a popup open, Esc closes the side panel, the sidebar and the New menu
    if (!open) return closeOverlays();
    if (open.id === "lockModal") return;
    if (open.id === "confirmModal") $("confirmCancel").click(); else closeModal(open.id);
  });

  /* ---------- Clipboard (with fallback for the Apps Script iframe) ---------- */
  function legacyCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  }
  function copyText(text) {
    const done = ok => ok ? toast("Link copied") : toast("Could not copy - please copy it manually", true);
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => done(true), () => done(legacyCopy(text)));
    } else {
      done(legacyCopy(text));
    }
  }

  /* ---------- Pages ---------- */
  const VIEWS = { home: "Home", tasks: "Tasks", links: "Links", admin: "Admin" };
  const PAGE_TITLES = { home: "Home", tasks: "Milestones", links: "Resources", admin: "Admin" };
  function showView(name) {
    // The link form opens as a side panel over the page you are on
    if (name === "submit") return openLinkPanel();
    closeOverlays();
    Object.keys(VIEWS).forEach(v => {
      $("view" + VIEWS[v]).hidden = name !== v;
      $("tab" + VIEWS[v]).classList.toggle("active", name === v);
    });
    document.querySelectorAll(".bottom-nav [data-nav]").forEach(b => b.classList.toggle("active", b.dataset.nav === name));
    $("pageTitle").textContent = PAGE_TITLES[name];
    state.page = name;
    if (name === "home") renderHome();
    if (name === "links") render();
    if (name === "tasks") renderTasks();
    if (name === "admin") loadAdmin();
    window.scrollTo(0, 0);
    // Restart the fade-in of the page that just opened
    const view = $("view" + VIEWS[name]);
    view.classList.remove("view-in");
    void view.offsetWidth;
    view.classList.add("view-in");
  }

  // Laptops: the sidebar shrinks to its icons and back; remembered in this browser (see the start of Index)
  function toggleSideCollapse(collapse) {
    const root = document.documentElement;
    collapse = typeof collapse === "boolean" ? collapse : !root.classList.contains("side-collapsed");
    root.classList.toggle("side-collapsed", collapse);
    const label = collapse ? "Expand the sidebar" : "Collapse the sidebar";
    $("sideCollapse").title = label;
    $("sideCollapse").setAttribute("aria-label", label);
    $("sideCollapse").setAttribute("aria-expanded", String(!collapse));
    try { localStorage.setItem("makutaSideCollapsed", collapse ? "1" : ""); } catch (e) {}
  }

  // Phones and tablets: the sidebar slides in over the page
  function toggleSidebar(open) {
    open = typeof open === "boolean" ? open : !document.body.classList.contains("sidebar-open");
    document.body.classList.toggle("sidebar-open", open);
  }
  function toggleNewMenu(open) {
    open = typeof open === "boolean" ? open : $("newMenu").hidden;
    $("newMenu").hidden = !open;
    $("newBtn").setAttribute("aria-expanded", String(open));
    document.body.classList.toggle("menu-open", open);
  }
  // Closes the sidebar, the New menu and the link panel (not the popups)
  function closeOverlays() {
    toggleSidebar(false);
    toggleNewMenu(false);
    closeLinkPanel();
  }
  function newItem(kind) {
    closeOverlays();
    if (kind === "brief") openBatchForm();
    else if (kind === "task") openTaskForm();
    else {
      // A link being edited is put away; a new one starts empty (an unsaved draft stays)
      if (state.editingId) resetForm();
      openLinkPanel();
    }
  }

  function openLinkPanel() {
    toggleSidebar(false);
    toggleNewMenu(false);
    $("drawerTitle").textContent = state.editingId ? "Edit resource" : "Add resource";
    $("viewSubmit").hidden = false;
    document.body.classList.add("drawer-open");
    setTimeout(() => $("viewSubmit").contains(document.activeElement) || $("title").focus(), 50);
  }
  function closeLinkPanel() {
    $("viewSubmit").hidden = true;
    document.body.classList.remove("drawer-open");
  }

  /* ---------- Who is logged in ---------- */
  // Header name, the owner's Admin tab, and the View as banner (everything that changes data is hidden)
  function showUser() {
    const u = state.user;
    $("userChip").hidden = false;
    $("userName").textContent = u.name;
    $("userAvatar").textContent = u.name.replace(/^(Kak|Bu) /, "").slice(0, 1).toUpperCase();
    // "Obi Content Writer", but just "Owner" for the owner
    $("userRole").textContent = u.roleName === u.name ? "" : u.roleName;
    // While viewing as someone else the Admin tab is hidden too (the banner's Exit brings it back)
    const owner = u.role === "owner";
    $("tabAdmin").hidden = !owner;
    // The Google Sheet holds every project, so only managerial and the owner get its button
    $("sheetLink").hidden = !["owner", "manager"].includes(u.role);
    $("viewAsBanner").hidden = !state.viewAs;
    if (state.viewAs) $("viewAsName").textContent = `${u.name} (${u.roleName})`;
    document.body.classList.toggle("read-only", !!u.readOnly);
    if (!owner && !$("viewAdmin").hidden) showView("home");
  }

  /* ---------- Data loading ---------- */
  function loadData() {
    $("results").innerHTML = `<div class="loading"><div class="spinner"></div>Loading...</div>`;
    return api("getInitialData").then(useData).catch(err => {
      const msg = `<div class="empty">Could not load data: ${escapeHtml(err.message)}<br><br><button class="btn-soft btn-sm" onclick="loadData()">Try again</button></div>`;
      $("results").innerHTML = $("taskResults").innerHTML = msg;
    });
  }

  // Everything the page shows, from getInitialData (or from the login answer)
  function useData(data) {
    state.links = data.links;
    state.tasks = data.tasks;
    state.cfg = data.taskConfig;
    state.user = data.user;
    state.app = data;
    state.loaded = true;
    if (data.sheetUrl) $("sheetLink").href = data.sheetUrl;
    showUser();
    refreshOptions();
    setupTaskOptions();
    render();
    renderTasks();
    checkDuplicate();
  }

  function uniqueValues(key) {
    return [...new Set(state.links.map(l => l[key]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  }

  function fillSelect(id, values, allLabel, label = v => v) {
    const sel = $(id), current = sel.value;
    sel.innerHTML = `<option value="">${allLabel}</option>` +
      values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(label(v))}</option>`).join("");
    sel.value = values.includes(current) ? current : "";
  }

  function refreshOptions() {
    updateProjectOrder();
    const projects = uniqueValues("project");
    $("projectList").innerHTML = projects.map(p => `<option value="${escapeHtml(p)}">`).join("");
    fillSelect("fCategory", uniqueValues("category"), "All categories", categoryLabel);
    // Resources may name any project; the brief & result links are from the projects of my tasks
    const all = state.linkTab === "tasks" ? taskProjects() : projects;
    fillSelect("fProject", all, "All projects", p => `${projectIcon(p)} ${p}`);
  }

  function upsertLocal(link) {
    const i = state.links.findIndex(l => l.id === link.id);
    if (i >= 0) state.links[i] = link; else state.links.push(link);
    refreshOptions();
    render();
  }

  /* ---------- Form ---------- */
  function showError(id, show) { $(id + "Err").hidden = !show; }

  function addVersionRow(v) {
    v = v || {};
    const row = document.createElement("div");
    row.className = "version-row";
    row.innerHTML = `<input class="v-label" placeholder="Label, e.g. Part 2 / Assets"><input class="v-url" placeholder="https:\/\/..."><button type="button" class="btn-danger btn-sm" title="Remove">&#10005;</button>`;
    row.querySelector(".v-label").value = v.label || "";
    row.querySelector(".v-url").value = v.url || "";
    row.querySelector("button").onclick = () => row.remove();
    $("versionList").appendChild(row);
  }

  // Rows that are completely empty are ignored; a row with only a label is kept so it fails validation
  function readVersions() {
    return [...document.querySelectorAll(".version-row")].map(r => ({
      label: r.querySelector(".v-label").value.trim(),
      url: normalizeUrl(r.querySelector(".v-url").value),
    })).filter(v => v.url || v.label);
  }

  function findDuplicate(url) {
    const key = urlKey(url);
    if (!key) return null;
    return state.links.find(l => l.id !== state.editingId &&
      [l.url, ...l.versions.map(v => v.url)].some(u => urlKey(u) === key));
  }

  // Category guessed from the address as it is pasted (only while the category is still empty)
  const URL_CATEGORIES = [
    [/docs\.google\.com\/document/i, "Google Docs"], [/docs\.google\.com\/spreadsheets/i, "Google Spreadsheets"],
    [/docs\.google\.com\/presentation/i, "Google Slide"], [/drive\.google\.com\/drive\/(u\/\d+\/)?folders/i, "Drive Folder"],
    [/pinterest\.|behance\.net|dribbble\.com/i, "Reference"],
  ];
  function guessCategory() {
    if ($("category").value || state.editingId) return;
    const hit = URL_CATEGORIES.find(([re]) => re.test($("url").value));
    if (!hit) return;
    $("category").value = hit[1];
    updateCategoryFields();
    showError("category", false);
  }

  function checkDuplicate() {
    const dup = findDuplicate($("url").value);
    state.dupId = dup ? dup.id : null;
    $("dupWarning").hidden = !dup;
    if (dup) {
      $("dupText").innerHTML = `Saved as <strong>${escapeHtml(dup.title)}</strong>${dup.project ? ` (${escapeHtml(dup.project)})` : ""} on ${formatDate(dup.createdAt)}. You can still submit if this is intentional.`;
    }
  }

  function viewDuplicate() {
    const dup = state.links.find(l => l.id === state.dupId);
    if (!dup) return;
    resetFilters(false);
    $("search").value = dup.title;
    showView("links");
  }

  function ensureOption(select, value) {
    if (value && ![...select.options].some(o => o.value === value)) select.add(new Option(value, value));
  }

  function resetForm() {
    $("linkForm").reset();
    $("versionList").innerHTML = "";
    state.editingId = null;
    $("editBanner").hidden = true;
    $("submitLabel").textContent = "Save resource";
    $("drawerTitle").textContent = "Add resource";
    ["title", "url", "category", "videoSource", "versions"].forEach(k => showError(k, false));
    $("dupWarning").hidden = true;
    updateCategoryFields();
  }

  // CTC-Video needs a second choice: whose edit the video is.
  // A Reference always belongs to the project "REFERENCE" (mirrors clean_ in Code.gs).
  function updateCategoryFields() {
    const isVideo = $("category").value === "CTC-Video";
    $("videoSourceField").hidden = !isVideo;
    if (!isVideo) {
      $("videoSource").value = "";
      showError("videoSource", false);
    }
    const isRef = $("category").value === "Reference";
    $("project").readOnly = isRef;
    if (isRef) $("project").value = REFERENCE_PROJECT;
    else if ($("project").value === REFERENCE_PROJECT) $("project").value = "";
  }

  // True when the form has unsaved input (so we don't silently throw it away)
  function formIsDirty() {
    return ["title", "url", "project", "purpose"].some(id => $(id).value.trim()) ||
      document.querySelectorAll(".version-row").length > 0;
  }

  async function startEdit(link) {
    if (state.editingId !== link.id && formIsDirty() && !await confirmDialog({
      emoji: "📝", title: "Discard unsaved changes?",
      message: "The form has text you haven't saved yet. Continue and replace it with this resource?", ok: "Discard & edit",
    })) return;
    resetForm();
    state.editingId = link.id;
    const cat = splitCategory(link.category);
    ensureOption($("category"), cat.base);
    ensureOption($("videoSource"), cat.source);
    $("title").value = link.title;
    $("url").value = link.url;
    $("category").value = cat.base;
    $("project").value = link.project;
    updateCategoryFields();
    $("videoSource").value = cat.source;
    $("purpose").value = link.purpose;
    $("pinned").checked = link.pinned;
    link.versions.forEach(v => addVersionRow(v));
    $("editTitle").textContent = link.title;
    $("editBanner").hidden = false;
    $("submitLabel").textContent = "Save changes";
    showView("submit");
    checkDuplicate();
  }

  function setBusy(busy) {
    $("submitBtn").disabled = busy;
    $("submitLabel").textContent = busy ? "Saving..." : (state.editingId ? "Save changes" : "Save resource");
  }

  async function submitForm(e) {
    e.preventDefault();
    const isVideo = $("category").value === "CTC-Video";
    const source = $("videoSource").value;
    const data = {
      title: $("title").value.trim(),
      url: normalizeUrl($("url").value),
      category: isVideo && source ? `CTC-Video [${source}]` : $("category").value,
      project: $("project").value.trim(),
      purpose: $("purpose").value.trim(),
      pinned: $("pinned").checked,
      versions: readVersions(),
    };
    const ok = {
      title: !!data.title,
      url: isValidUrl(data.url),
      category: !!data.category,
      videoSource: !isVideo || !!source,
      versions: data.versions.every(v => isValidUrl(v.url)),
    };
    Object.keys(ok).forEach(k => showError(k, !ok[k]));
    const firstError = Object.keys(ok).find(k => !ok[k]);
    if (firstError) {
      // Bring the first problem into view so it can't be missed
      const el = firstError === "versions" ? $("versionList") : $(firstError);
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      if (el.focus) el.focus({ preventScroll: true });
      return;
    }

    const editing = state.editingId;
    setBusy(true);
    try {
      const saved = editing ? await api("updateLink", editing, data) : await api("addLink", data);
      upsertLocal(saved);
      resetForm();
      $("successTitle").textContent = editing ? "Changes saved" : "Resource saved";
      $("successText").textContent = `"${saved.title}" has been ${editing ? "updated" : "saved"}.`;
      openModal("successModal");
      if (saved.warning) toast(saved.warning, true);
    } catch (err) {
      toast("Save failed: " + err.message, true);
    } finally {
      setBusy(false);
    }
  }

  /* ---------- Resources: filtering ---------- */
  function resetFilters(rerender = true) {
    ["search", "fCategory", "fProject"].forEach(id => $(id).value = "");
    $("sort").value = "newest";
    $("pinnedOnly").checked = false;
    if (rerender) render();
  }

  function getFiltered() {
    const q = $("search").value.trim().toLowerCase();
    const cat = $("fCategory").value, proj = $("fProject").value, pinnedOnly = $("pinnedOnly").checked;
    return state.links.filter(l => {
      if (cat && l.category !== cat) return false;
      if (proj && l.project !== proj) return false;
      if (pinnedOnly && !l.pinned) return false;
      if (q) {
        const haystack = [l.title, l.url, l.category, l.project, l.purpose, ...l.versions.flatMap(v => [v.label, v.url])].join(" ").toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    }).sort((a, b) => (b.pinned - a.pinned) || SORTERS[$("sort").value](a, b));
  }

  // Brief & result links: every task I can see that has one, last changed first
  function getTaskLinks() {
    const q = $("search").value.trim().toLowerCase(), proj = $("fProject").value;
    return state.tasks.filter(t => (t.briefLink || t.resultLink) && (!proj || t.project === proj) &&
      (!q || [t.title, t.project, t.type, t.briefLink, t.resultLink].join(" ").toLowerCase().includes(q)))
      .sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
  }

  /* ---------- Resources: rendering ---------- */
  function categoryBadge(c) {
    const base = splitCategory(c).base;
    return `<span class="cat cat-${base in CATEGORY_ICONS ? slug(base) : "other"}">${escapeHtml(categoryLabel(c))}</span>`;
  }

  // Each project gets its own color. Projects are numbered by when they first appeared,
  // so a new project never changes the color of an existing one.
  const PROJECT_HUES = [212, 145, 28, 280, 350, 185, 48, 320, 100, 250, 5, 165];
  let projectOrder = {};
  function updateProjectOrder() {
    projectOrder = {};
    [...state.links].sort(SORTERS.oldest).forEach(l => {
      if (l.project && !(l.project in projectOrder)) projectOrder[l.project] = Object.keys(projectOrder).length;
    });
  }
  function projectHue(name) {
    const i = projectOrder[name];
    if (i !== undefined) return PROJECT_HUES[i % PROJECT_HUES.length] + Math.floor(i / PROJECT_HUES.length) * 15;
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return h;
  }
  // Emoji for a project (set in Code.gs), matched without caring about upper/lower case
  function projectIcon(name) {
    const projects = (state.cfg && state.cfg.projects) || {};
    const key = Object.keys(projects).find(p => p.toLowerCase() === String(name || "").trim().toLowerCase());
    return key ? projects[key].icon : name === REFERENCE_PROJECT ? CATEGORY_ICONS.Reference : "📁";
  }
  const projectAvatar = name => name
    ? `<span class="avatar" style="--h:${projectHue(name)}">${projectIcon(name)}</span>`
    : `<span class="avatar avatar-none">?</span>`;
  function projectChip(name) {
    if (!name) return `<span class="muted">-</span>`;
    return `<span class="proj" style="--h:${projectHue(name)}">${projectIcon(name)} ${escapeHtml(name)}</span>`;
  }

  const rowClass = l => l.pinned ? "row-pinned" : "";

  function titleBlock(l) {
    const versions = l.versions.length
      ? `<div class="chips">${l.versions.map(v => `<a class="chip" href="${safeHref(v.url)}" target="_blank" rel="noopener" title="${escapeHtml(v.url)}">${escapeHtml(v.label || "Link")}</a>`).join("")}</div>`
      : "";
    return `<strong>${escapeHtml(l.title) || "(untitled)"}</strong><a class="main-link" href="${safeHref(l.url)}" target="_blank" rel="noopener" title="${escapeHtml(l.url)}">${escapeHtml(l.url)}</a>${versions}`;
  }

  function pinButton(l) {
    return `<button class="pin${l.pinned ? " on" : ""}" data-act="pin" data-id="${escapeHtml(l.id)}" title="${l.pinned ? "Unpin" : "Pin to top"}">&#9733;</button>`;
  }

  // Icon + word; the table shows only the icons (the word stays as the tooltip and for screen readers)
  const ACT_ICONS = {
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    delete: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  };
  function actionButtons(l) {
    const id = escapeHtml(l.id);
    const btn = (act, label, cls) => `<button class="btn-sm ${cls}" data-act="${act}" data-id="${id}" title="${label}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ACT_ICONS[act]}</svg><span class="act-text">${label}</span></button>`;
    return `<div class="row-actions">${btn("copy", "Copy", "btn-soft")}${btn("edit", "Edit", "btn-soft")}${btn("delete", "Delete", "btn-danger")}</div>`;
  }

  // Fixed column widths so the table always fits; the date added and description sit under the title.
  // When the page is too narrow for the table, each row becomes a card (see Styles)
  function renderTable(list) {
    return `<div class="table-wrap"><table class="links-table">
      <colgroup><col class="c-pin"><col><col class="c-cat"><col class="c-proj"><col class="c-act"></colgroup>
      <thead><tr><th><span class="sr-only">Pin</span></th><th>Title &amp; link</th><th>Category</th><th>Project</th><th><span class="sr-only">Actions</span></th></tr></thead>
      <tbody>${list.map(l => `
        <tr class="${rowClass(l)}">
          <td class="pin-cell">${pinButton(l)}</td>
          <td class="title-cell">${titleBlock(l)}<div class="link-meta" title="${formatDate(l.createdAt)}">Added ${addedDay(l) ? formatDay(addedDay(l)) : "-"}${l.purpose ? ` · <span class="link-desc">${escapeHtml(l.purpose)}</span>` : ""}</div></td>
          <td data-label="Category">${categoryBadge(l.category)}</td>
          <td data-label="Project">${projectChip(l.project)}</td>
          <td class="act-cell">${actionButtons(l)}</td>
        </tr>`).join("")}
      </tbody></table></div>`;
  }

  // Brief & result links of the tasks, with the step each task is at (opens the task in Milestones)
  function renderTaskLinks(list) {
    const open = (url, label) => url ? `<a class="tag tag-link" href="${safeHref(url)}" target="_blank" rel="noopener">${label} ↗</a>` : `<span class="muted">Not yet</span>`;
    return `<div class="table-wrap"><table class="links-table task-links">
      <colgroup><col><col class="c-proj"><col class="c-link"><col class="c-link"></colgroup>
      <thead><tr><th>Task</th><th>Project</th><th>Brief</th><th>Result</th></tr></thead>
      <tbody>${list.map(t => `
        <tr>
          <td class="title-cell"><button type="button" class="link-task" data-open="${escapeHtml(t.id)}" title="Open in Milestones">${escapeHtml(t.title)}</button>
            <div class="link-meta">${t.stage === "done" ? `✓ ${escapeHtml(doneLabel(t))}` : `Now: ${escapeHtml(stageOf(t.stage).name)}`}</div></td>
          <td data-label="Project">${projectChip(t.project)}</td>
          <td data-label="Brief">${open(t.briefLink, "📄 Brief")}</td>
          <td data-label="Result">${open(t.resultLink, "🎨 Result")}</td>
        </tr>`).join("")}
      </tbody></table></div>`;
  }

  function renderGroups(list) {
    const groups = {};
    list.forEach(l => (groups[l.project] = groups[l.project] || []).push(l));
    // Projects A-Z, links without a project last
    return Object.keys(groups).sort((a, b) => (!a - !b) || a.localeCompare(b)).map(name => {
      const items = groups[name];
      return `<section class="group">
        <div class="group-head">
          <h3>${projectAvatar(name)}${escapeHtml(name) || "No project"}</h3>
          <span>${plural(items.length, "resource")}</span>
        </div>
        ${items.map(l => `
          <div class="group-item ${rowClass(l)}">
            ${pinButton(l)}
            <div class="main">
              ${titleBlock(l)}
              <div class="meta-line">
                ${categoryBadge(l.category)}
                <span>Added ${formatDate(l.createdAt)}</span>
              </div>
              ${l.purpose ? `<p class="desc">${escapeHtml(l.purpose)}</p>` : ""}
            </div>
            <div class="group-actions">${actionButtons(l)}</div>
          </div>`).join("")}
      </section>`;
    }).join("");
  }


  // Phones fold the filters behind a button; it says how many are in use (the search box stays open)
  function updateFilterToggle(view) {
    const panel = $(view).querySelector(".filter-panel");
    const n = panel.querySelectorAll(".filters .is-active").length + (panel.querySelector(".check-row input:checked") ? 1 : 0);
    panel.querySelector(".filter-toggle").textContent = n ? `Filters (${n})` : "Filters";
  }

  // Highlight filters that are in use, so it's obvious why the list is shorter
  function markActiveFilters() {
    const tasks = state.linkTab === "tasks";
    let active = 0;
    ["search", "fProject", "fCategory"].forEach(id => {
      const on = !!$(id).value && (!tasks || id !== "fCategory");
      $(id).classList.toggle("is-active", on);
      if (on) active++;
    });
    if (!tasks && $("pinnedOnly").checked) active++;
    updateFilterToggle("viewLinks");
    return active;
  }

  const LINK_TAB_NOTES = {
    resources: "Brand guidelines, moodboards, content calendars and references the team keeps using.",
    tasks: "Every task's brief and result, added when its step is pressed in Milestones.",
  };
  function showLinkTab(tab) {
    state.linkTab = tab;
    document.querySelectorAll("[data-ltab]").forEach(b => {
      b.classList.toggle("active", b.dataset.ltab === tab);
      b.setAttribute("aria-selected", String(b.dataset.ltab === tab));
    });
    $("viewLinks").classList.toggle("tab-tasks", tab === "tasks");
    $("search").placeholder = tab === "tasks" ? "Search task, project or link..." : "Search title, link or project...";
    refreshOptions();
    render();
  }

  function render() {
    if (!state.loaded) return;
    $("linkTabNote").textContent = LINK_TAB_NOTES[state.linkTab];
    const active = markActiveFilters();
    const filterNote = active ? ` <span class="filter-note">${plural(active, "filter")} active</span>` : "";
    if (state.linkTab === "tasks") {
      const list = getTaskLinks(), total = state.tasks.filter(t => t.briefLink || t.resultLink).length;
      $("count").innerHTML = `Showing <b>${list.length}</b> of ${plural(total, "task")} with links` + filterNote;
      $("results").innerHTML = list.length ? renderTaskLinks(list) : `<div class="empty">${total
        ? `<div class="empty-emoji">🔍</div><strong>No task matches your search.</strong><br><a href="#" onclick="resetFilters(); return false;">Reset filters</a>`
        : `<div class="empty-emoji">📭</div><strong>No brief or result links yet.</strong><br>They appear here once a brief is submitted for QC.`}</div>`;
      return;
    }
    const list = getFiltered();
    const total = state.links.length;
    $("count").innerHTML = `Showing <b>${list.length}</b> of ${plural(total, "resource")}` + filterNote;
    if (!list.length) {
      $("results").innerHTML = `<div class="empty">${total
        ? `<div class="empty-emoji">🔍</div><strong>No resources match your search or filters.</strong><br><a href="#" onclick="resetFilters(); return false;">Reset filters</a>`
        : `<div class="empty-emoji">📭</div><strong>No resources yet.</strong><br><a href="#" onclick="newItem('link'); return false;">Add the first one</a>`}</div>`;
      return;
    }
    $("results").innerHTML = state.view === "table" ? renderTable(list) : renderGroups(list);
  }

  /* ---------- Resources: actions ---------- */
  function togglePin(link) {
    link.pinned = !link.pinned;
    render();
    api("setPinned", link.id, link.pinned).catch(err => {
      link.pinned = !link.pinned;
      render();
      toast("Could not update pin: " + err.message, true);
    });
  }

  async function handleAction(e) {
    const task = e.target.closest("[data-open]");
    if (task) return openTask(task.dataset.open);
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const link = state.links.find(l => l.id === btn.dataset.id);
    if (!link) return;
    const act = btn.dataset.act;

    if (act === "copy") copyText(link.url);
    else if (act === "edit") startEdit(link);
    else if (act === "pin") togglePin(link);
    else if (act === "delete" && await confirmDialog({ title: "Delete this resource?", message: `"${link.title}" will be permanently removed, including from the Google Sheet.` })) {
      try {
        await api("deleteLink", link.id);
        state.links = state.links.filter(l => l.id !== link.id);
        if (state.editingId === link.id) resetForm();
        refreshOptions();
        render();
        toast("Resource deleted");
      } catch (err) {
        toast("Delete failed: " + err.message, true);
      }
    }
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Could not load the Excel library. Check your internet connection."));
      document.head.appendChild(s);
    });
  }

  // Exports exactly what is currently shown (search + filters applied)
  async function exportExcel() {
    const list = getFiltered();
    if (!list.length) return toast("Nothing to export", true);
    try {
      if (!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
      const rows = list.map(l => ({
        "Date Added": formatDate(l.createdAt),
        "Title": l.title,
        "Main Link": l.url,
        "Category": l.category,
        "Project": l.project,
        "Pinned": l.pinned ? "Yes" : "No",
        "Description": l.purpose,
        "Related Links": l.versions.map(v => `${v.label || "Link"}: ${v.url}`).join("\n"),
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = [18, 40, 50, 16, 16, 8, 50, 50].map(wch => ({ wch }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Resources");
      XLSX.writeFile(wb, `makuta-resources-${today()}.xlsx`);
    } catch (err) {
      toast(err.message, true);
    }
  }

  /* ---------- Milestones: setup ---------- */
  // The Show dropdown: which tasks (show) or the stage they are at (stage, the same columns as Home's
  // Projects table). Finished tasks stay in the default view (dimmed, at the bottom) for this many days.
  const RECENT_DONE_DAYS = 30;
  const STEP_GROUPS = {
    current: { show: true, label: "Active + recently done", test: t => t.stage !== "done" || daysSince(finishedAt(t)) <= RECENT_DONE_DAYS },
    active: { show: true, label: "Active only", test: t => t.stage !== "done" },
    mine: { show: true, label: "My Tasks", test: t => isMyStep(t) },
    late: { show: true, label: "Late", test: t => t.stage !== "done" && !!t.deadline && t.deadline < today() },
    // Today up to a week ahead; what is already late is counted under Late, not twice
    soon: { show: true, label: "Due in 7 days", test: t => t.stage !== "done" && !!t.deadline && daysUntil(t.deadline) >= 0 && daysUntil(t.deadline) <= 7 },
    done: { show: true, label: "Done", test: t => t.stage === "done" },
    all: { show: true, label: "All tasks", test: () => true },
    drafting: { label: "Brief", test: t => ["brief", "revision"].includes(t.stage) },
    qc: { label: "QC Internal", test: t => ["qcBrief", "qcCut", "qcContent"].includes(t.stage) },
    production: { label: "Production", test: t => ["shoot", "vo", "video", "design", "motion"].includes(t.stage) },
    client: { label: "At client", test: t => ["toClient", "qcClient"].includes(t.stage) },
    ready: { label: "Ready to post", test: t => ["post", "ads"].includes(t.stage) },
  };
  const isVideoType = type => /^Video/.test(type);
  const isEventType = type => type === state.cfg.eventType;
  const isCollateralType = type => type === state.cfg.collateralType;
  const TYPE_ICONS = { video: "🎬", event: "🎪", collateral: "🖨️", static: "🖼️" };
  const typeKind = type => isVideoType(type) ? "video" : isEventType(type) ? "event" : isCollateralType(type) ? "collateral" : "static";
  const stageOf = key => state.cfg.stages.find(s => s.key === key) || { key, name: key, role: "" };
  // "Content Writer: Obi · Graphic Designer: Alfid" and " · Organic only" / " · ADS only"
  const projectTeam = p => `Content Writer: ${escapeHtml(p.writer || "-")} · Graphic Designer: ${escapeHtml(p.designer || "-")}`;
  const channelNote = p => p.orgOnly ? " · Organic only" : p.adsOnly ? " · ADS only" : "";
  const projectWriter = t => (state.cfg.projects[t.project] || {}).writer || "Content Writer";
  // Who does this step for this task (mirrors stageOwner_ in Code.gs)
  function stageOwner(s, t) {
    if (s.key === "shoot") return `${projectWriter(t)} & ${t.videographer || "Videographer"}`;
    return s.person || (s.role === "Graphic Designer" ? t.designer : s.role === "Videographer" ? t.videographer : s.role === "Content Writer" ? projectWriter(t) : "") || s.role;
  }

  /* ---------- Who may do what (mirrors the rules in Code.gs, which enforces them) ---------- */
  // While the owner uses View as, nothing can be changed
  const me = () => state.user || { role: "", name: "", projects: [] };
  const isBoss = () => ["owner", "manager"].includes(me().role) && !me().readOnly;
  const stepActor = key => state.cfg.stepActors[key] || "writer";
  // The project's content writer, managerial and the owner create, edit and delete its tasks
  const managesProject = project => !me().readOnly && (isBoss() || (me().role === "writer" && (state.cfg.projects[project] || {}).writer === me().name));
  // The assistant manager's steps (Send to Client, QC Client, Run Ads) are the same for every project
  const actsOn = (u, actor, t) => u.role === actor && (actor === "assistant" || (state.cfg.projects[t.project] || {})[actor] === u.name);
  function canPress(t) {
    if (me().readOnly || t.stage === "done") return false;
    return isBoss() || actsOn(me(), stepActor(t.stage), t);
  }
  function canUndo(t) {
    const last = t.history[t.history.length - 1] || {};
    return !me().readOnly && (isBoss() || (last.by ? last.by === me().name : managesProject(t.project)));
  }
  const canTick = t => managesProject(t.project) || (!me().readOnly && me().role === "designer" && (state.cfg.projects[t.project] || {}).designer === me().name);
  // My Tasks: the steps I am responsible for (not every step managerial could press). Bu Riska also
  // has the Voice Over steps, which carry her name.
  function isMyStep(t) {
    if (t.stage === "done") return false;
    const actor = stepActor(t.stage), u = me();
    if (u.role === "manager") return actor === "manager" || stageOf(t.stage).person === u.name;
    return actsOn(u, actor, t);
  }
  // "Alfid", "Client (via Kak Faza)", "QC (Kak Hendra / Bu Riska)" (mirrors waitingFor_ in Code.gs)
  function waitingFor(t) {
    const owner = stageOwner(stageOf(t.stage), t), actor = stepActor(t.stage);
    if (actor === "manager") return `QC (${owner})`;
    // Who presses the button for someone without an account (the client, the freelancers)
    const via = actor === "writer" ? projectWriter(t) : actor === "assistant" ? state.cfg.assistantName : "";
    return via && owner !== via && !owner.startsWith(via + " ") ? `${owner} (via ${via})` : owner;
  }
  // The link a step works from: the brief until the work is made, then the result
  const RESULT_STAGES = ["qcContent", "toClient", "qcClient", "revision", "post", "ads", "done"];
  const LINK_NAMES = { briefLink: "📄 Brief", resultLink: "🎨 Result" };
  const linkTag = (t, field) => t[field] ? `<a class="tag tag-link" href="${safeHref(t[field])}" target="_blank" rel="noopener">${LINK_NAMES[field]} ↗</a>` : "";
  function workLink(t) {
    const field = RESULT_STAGES.includes(t.stage) ? "resultLink" : "briefLink";
    return t[field] ? `<a class="btn btn-sm btn-soft link-open" href="${safeHref(t[field])}" target="_blank" rel="noopener">${field === "briefLink" ? "📄 Open brief" : "🎨 Open result"} ↗</a>` : "";
  }
  const doneLabel = t => isCollateralType(t.type) ? "Approved by Client" : t.channel === "ADS" ? "Live on Ads" : "Scheduled / Posted";
  // Mirrors channelFromTitle_ in Code.gs: "BRIEF ORG NOV KRR" -> "ORG" ("" when neither or both)
  function channelFromTitle(title) {
    const found = Object.keys(state.cfg.channels).filter(c => new RegExp(`(^|[^A-Za-z])${c}([^A-Za-z]|$)`, "i").test(title));
    return found.length === 1 ? found[0] : "";
  }
  // The project code written in the title, e.g. "KRR" in "BRIEF ORG NOV KRR"
  function projectFromTitle(title) {
    const words = title.toUpperCase().split(/[^A-Z0-9]+/);
    return Object.keys(state.cfg.projects).find(p => words.includes(p.toUpperCase())) || "";
  }
  // Steps that can fix a client revision (mirrors fixSteps_ in Code.gs)
  const fixSteps = t => t.steps.filter(k => ["video", "design", "motion"].includes(k));
  // Monthly Brief tasks that move together with t at its current step (mirrors linkedTasks_ in Code.gs):
  // one brief per channel, one QC for the ORG + ADS briefs, one shooting for all the month's videos
  function linkedTasks(t) {
    if (!t.workMonth || !["brief", "qcBrief", "shoot"].includes(t.stage)) return [];
    return state.tasks.filter(o => o.id !== t.id && o.project === t.project && o.workMonth === t.workMonth &&
      o.stage === t.stage && (t.stage !== "brief" || o.channel === t.channel));
  }
  const typeShort = type => isVideoType(type) ? "Video" : type;
  // "2026-12" -> "DECEMBER 2026"
  const monthLabel = ym => `${MONTHS[Number(ym.slice(5, 7)) - 1]} ${ym.slice(0, 4)}`;
  // What a shared button also moves, e.g. "Static + Video" or "ORG + ADS"
  function togetherLabel(t) {
    const group = [t].concat(linkedTasks(t));
    if (group.length < 2) return "";
    const channels = Object.keys(state.cfg.channels).filter(c => group.some(o => o.channel === c));
    return channels.length > 1 ? channels.join(" + ") : [...new Set(group.map(o => typeShort(o.type)))].join(" + ");
  }

  function setupTaskOptions() {
    const cfg = state.cfg;
    $("tfVideographer").innerHTML = `<option value="">-- Select --</option>` + cfg.videographers.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)} (VG-${escapeHtml(v)})</option>`).join("");
    // New tasks only for the projects this account looks after
    $("tfProject").innerHTML = $("bfProject").innerHTML = `<option value="">-- Select --</option>` +
      Object.keys(cfg.projects).filter(managesProject).map(p => `<option value="${escapeHtml(p)}">${projectIcon(p)} ${escapeHtml(p)}</option>`).join("");
    $("bfVideographer").innerHTML = $("tfVideographer").innerHTML;
    // The owner has no steps of their own, so no My Tasks
    const groups = Object.keys(STEP_GROUPS).filter(k => k !== "mine" || me().role !== "owner");
    const options = show => groups.filter(k => !!STEP_GROUPS[k].show === show).map(k => `<option value="${k}">${STEP_GROUPS[k].label}</option>`).join("");
    $("tStep").innerHTML = `<optgroup label="Tasks">${options(true)}</optgroup><optgroup label="At stage">${options(false)}</optgroup>`;
    $("tStep").value = defaultStep();
    // Only the content writers, managerial and the owner create tasks
    document.querySelectorAll(".task-create").forEach(b => b.hidden = !Object.keys(cfg.projects).some(managesProject));
    refreshTaskProjects();
  }
  // Graphic designers start on their own steps; everyone else on all current work
  const defaultStep = () => me().role === "designer" ? "mine" : "current";

  // This account's projects first (VTB, KRR, ...), then any other project used in a task it can see
  function taskProjects() {
    const known = Object.keys(state.cfg.projects).filter(p => me().projects.includes(p));
    const extra = [...new Set(state.tasks.map(t => t.project))].filter(p => p && !known.includes(p)).sort((a, b) => a.localeCompare(b));
    return known.concat(extra);
  }
  // The month a task's content is for ("2026-12"); tasks without one (Event, Single Task) use their deadline month
  const taskMonth = t => t.forMonth || (t.deadline || "").slice(0, 7);
  function refreshTaskProjects() {
    const projects = taskProjects();
    fillSelect("tProject", projects, "All projects", p => `${projectIcon(p)} ${p}`);
    // Months that have tasks, newest first
    const months = [...new Set(state.tasks.map(taskMonth))].filter(m => /^\d{4}-\d{2}$/.test(m)).sort().reverse();
    fillSelect("tMonth", months, "All months", m => monthLabel(m).charAt(0) + monthLabel(m).slice(1).toLowerCase());
  }

  function upsertTask(task) {
    const i = state.tasks.findIndex(t => t.id === task.id);
    if (i >= 0) state.tasks[i] = task; else state.tasks.push(task);
    refreshTaskProjects();
    renderTasks();
  }

  /* ---------- Milestones: new / edit task form ---------- */
  // Content types a project makes (Event Attribute only where the project lists it); every project can get Collateral
  const projectTypes = p => ((p && p.types) || state.cfg.contentTypes.filter(v => !isEventType(v)))
    .filter(v => !isCollateralType(v)).concat(state.cfg.collateralType);

  function fillTaskTypes() {
    const types = projectTypes(state.cfg.projects[$("tfProject").value]);
    const current = $("tfType").value;
    $("tfType").innerHTML = `<option value="">-- Select --</option>` + types.map(v => `<option>${escapeHtml(v)}</option>`).join("");
    $("tfType").value = types.includes(current) ? current : "";
  }

  function openTaskForm(t) {
    if (!state.loaded) return toast("Still loading, please try again in a moment.", true);
    state.editingTaskId = t ? t.id : null;
    $("taskForm").reset();
    $("taskModalTitle").textContent = t ? "Edit Task" : "New Task";
    $("taskSaveBtn").textContent = t ? "Save Changes" : "Create Task";
    $("taskFormErr").hidden = true;
    $("tfProject").dataset.auto = "";
    $("tfTitle").dataset.auto = "";
    $("tfType").value = "";
    $("tfItem").innerHTML = `<option value="">-- Select --</option>` + state.cfg.collateralItems.map(v => `<option>${escapeHtml(v)}</option>`).join("");
    fillTaskTypes();
    if (t) {
      $("tfTitle").value = t.title;
      ensureOption($("tfProject"), t.project);
      $("tfProject").value = t.project;
      fillTaskTypes();
      ensureOption($("tfType"), t.type);
      $("tfType").value = t.type;
      ensureOption($("tfItem"), t.item);
      $("tfItem").value = t.item || "";
      $("tfDeadline").value = t.deadline;
      ensureOption($("tfVideographer"), t.videographer);
      $("tfVideographer").value = t.videographer;
      $("tfBriefLink").value = t.briefLink;
      $("tfResultLink").value = t.resultLink;
      $("tfNotes").value = t.notes;
    }
    // The result link is the graphic designer's; it only shows on a task that can have one
    $("tfResultField").hidden = !t;
    updateTaskForm();
    openModal("taskModal");
    $("tfTitle").focus();
  }

  // Typing the title picks the project when it names one (until the project is chosen by hand)
  function onTaskTitleInput() {
    $("tfTitle").dataset.auto = "";
    const p = projectFromTitle($("tfTitle").value);
    if (p && (!$("tfProject").value || $("tfProject").dataset.auto)) {
      $("tfProject").value = p;
      $("tfProject").dataset.auto = "1";
      fillTaskTypes();
    }
    updateTaskForm();
  }

  function updateTaskForm() {
    const type = $("tfType").value, collateral = isCollateralType(type);
    const p = state.cfg.projects[$("tfProject").value];
    // Collateral: one item per task, titled "FLYER KRR" until the title is typed by hand
    $("tfItemField").hidden = !collateral;
    if (collateral && $("tfItem").value && p && (!$("tfTitle").value.trim() || $("tfTitle").dataset.auto)) {
      $("tfTitle").value = `${$("tfItem").value} ${$("tfProject").value}`.toUpperCase();
      $("tfTitle").dataset.auto = "1";
    }
    const title = $("tfTitle").value, channel = collateral ? "" : channelFromTitle(title);
    // New tasks get the project's videographer; another one can only be picked when editing.
    // Projects without a fixed videographer (Makuta) choose one for every video task.
    $("tfVideographerField").hidden = !(isVideoType(type) && (state.editingTaskId || (p && !p.videographer)));
    $("tfDetected").innerHTML = collateral ? "Collateral is not posted, so no ORG / ADS is needed. Format: [ITEM] [PROJECT], e.g. FLYER KRR"
      : channel
      ? `Detected: <span class="chan chan-${channel.toLowerCase()}">${channel}</span> ${channel === "ADS" ? "Ads Manager (Musthofa)" : "client's social media"}`
      : title.trim() ? `<span class="text-danger">Write ORG or ADS in the title.</span>` : "Format: [BRIEF / VIDEO CTC / EVENT] [ORG / ADS] [MONTH] [PROJECT]";
    // "VIDEO CTC" in the title but a Static type (or the other way round) is probably a mistake
    const saysVideo = /\bVIDEO\s+CTC\b/i.test(title);
    if (type && saysVideo !== isVideoType(type) && (saysVideo || /\bBRIEF\b/i.test(title))) {
      $("tfDetected").innerHTML += `<br><span class="text-danger">The title says ${saysVideo ? "VIDEO CTC" : "BRIEF"} but the content type is ${escapeHtml(type)}. Please double-check.</span>`;
    }
    $("tfDesigner").innerHTML = !p ? ""
      : !collateral && p.orgOnly && channel === "ADS" ? `<span class="text-danger">${escapeHtml($("tfProject").value)} is organic only. Use ORG in the title.</span>`
      : !collateral && p.adsOnly && channel === "ORG" ? `<span class="text-danger">${escapeHtml($("tfProject").value)} runs ADS only. Use ADS in the title.</span>`
      : `${projectTeam(p)} · Videographer: ${p.videographer ? escapeHtml(p.videographer) : "chosen per video"}${channelNote(p)}`;
    // Event Attribute: the deadline is the event day, and the countdown posts are counted back from it
    const event = isEventType(type);
    $("tfDeadlineLabel").innerHTML = event ? `Event Date (D-Day) <span class="req">*</span>` : "Deadline";
    $("tfEventItems").hidden = !event;
    if (event) $("tfEventItems").innerHTML = `Included in this task: ${state.cfg.eventItems.map(i => escapeHtml(eventItemLabel(i, $("tfDeadline").value))).join(" · ")}`;
    $("tfSteps").innerHTML = type && (channel || collateral)
      ? `Timeline: ${previewSteps(type, channel).map(escapeHtml).join(" → ")}`
      : "Write ORG / ADS in the title and choose the content type to see the timeline.";
  }

  // "Countdown H-5 (10 Dec)" once the event date is known
  function eventItemLabel(item, day) {
    if (item.days === undefined || !day) return item.name;
    const d = parseDay(day);
    d.setDate(d.getDate() - item.days);
    return `${item.name} (${d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" })})`;
  }

  // Step names for the form preview (the server decides the real steps)
  function previewSteps(type, channel) {
    const keys = state.cfg.stages.filter(s => !s.extra).map(s => s.key).filter(k =>
      k === "vo" ? type === "Video (Non-Shooting)" :
      k === "shoot" ? type === "Video (Shooting)" :
      k === "video" || k === "qcCut" || k === "motion" ? isVideoType(type) :
      k === "design" ? !isVideoType(type) :
      k === "post" ? channel !== "ADS" && !isCollateralType(type) :
      k === "ads" ? channel === "ADS" && !isCollateralType(type) : true);
    return keys.map(k => stageOf(k).name);
  }

  async function submitTaskForm(e) {
    e.preventDefault();
    const data = {
      title: $("tfTitle").value.trim(),
      project: $("tfProject").value,
      type: $("tfType").value,
      deadline: $("tfDeadline").value,
      videographer: $("tfVideographerField").hidden ? "" : $("tfVideographer").value,
      briefLink: $("tfBriefLink").value.trim() ? normalizeUrl($("tfBriefLink").value) : "",
      resultLink: $("tfResultLink").value.trim() ? normalizeUrl($("tfResultLink").value) : "",
      notes: $("tfNotes").value.trim(),
      item: $("tfItemField").hidden ? "" : $("tfItem").value,
    };
    const collateral = isCollateralType(data.type);
    // A Collateral title is written from its item, so ask for the item first
    const problem = collateral && !data.item ? ["tfItem", "Please choose the collateral item (e.g. Flyer, Billboard)."]
      : !data.title ? ["tfTitle", "Title is required."]
      : !collateral && !channelFromTitle(data.title) ? ["tfTitle", 'Write either ORG or ADS in the title, e.g. "BRIEF ORG DECEMBER KRR".']
      : !data.project ? ["tfProject", "Please choose the project."]
      : !collateral && (state.cfg.projects[data.project] || {}).orgOnly && channelFromTitle(data.title) !== "ORG" ? ["tfTitle", `${data.project} is organic only. Use ORG in the title.`]
      : !collateral && (state.cfg.projects[data.project] || {}).adsOnly && channelFromTitle(data.title) !== "ADS" ? ["tfTitle", `${data.project} runs ADS only. Use ADS in the title.`]
      : !data.type ? ["tfType", "Please choose the content type."]
      : !projectTypes(state.cfg.projects[data.project]).includes(data.type) ? ["tfType", `${data.project} has no ${data.type} content.`]
      : !$("tfVideographerField").hidden && !data.videographer ? ["tfVideographer", `Please choose the videographer (${state.cfg.videographers.join(" or ")}).`]
      : isEventType(data.type) && !data.deadline ? ["tfDeadline", "Please fill in the event date (D-Day)."]
      : data.briefLink && !isValidUrl(data.briefLink) ? ["tfBriefLink", "Please enter a valid brief link, or leave it empty."]
      : data.resultLink && !isValidUrl(data.resultLink) ? ["tfResultLink", "Please enter a valid result link, or leave it empty."]
      : null;
    $("taskFormErr").hidden = !problem;
    if (problem) {
      $("taskFormErr").textContent = problem[1];
      $(problem[0]).focus();
      return;
    }
    const editing = state.editingTaskId;
    $("taskSaveBtn").disabled = true;
    try {
      const saved = editing ? await api("updateTask", editing, data) : await api("addTask", data);
      upsertTask(saved);
      closeModal("taskModal");
      toast(editing ? "Task updated" : `Task created: now at "${stageOf(saved.stage).name}"`);
    } catch (err) {
      $("taskFormErr").textContent = "Save failed: " + err.message;
      $("taskFormErr").hidden = false;
    } finally {
      $("taskSaveBtn").disabled = false;
    }
  }

  /* ---------- Milestones: Monthly Brief (all tasks of one month at once) ---------- */
  // One shooting per month covers both ORG and ADS, so a month's brief is every content type the
  // project makes (except Event Attribute) for each channel it runs.
  const MONTHS = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

  // The month a channel's content is for, when the briefs are written in workMonth ("2026-11"):
  // ORG is a month ahead (December), ADS is the same month (November). Returns { name, year }.
  function contentMonth(workMonth, channel) {
    const d = new Date(Number(workMonth.slice(0, 4)), Number(workMonth.slice(5, 7)) - 1 + (state.cfg.briefMonthsAhead[channel] || 0), 1);
    return { name: MONTHS[d.getMonth()], year: d.getFullYear() };
  }

  // "BRIEF ORG DECEMBER KRR" / "VIDEO CTC ADS NOVEMBER KRR". A project with both video types
  // (Makuta) gets "NON-SHOOTING" added, so the two titles differ.
  function batchTitle(project, type, channel, workMonth) {
    const both = projectTypes(state.cfg.projects[project]).filter(isVideoType).length > 1;
    const kind = !isVideoType(type) ? "BRIEF" : both && type === "Video (Non-Shooting)" ? "VIDEO CTC NON-SHOOTING" : "VIDEO CTC";
    return `${kind} ${channel} ${contentMonth(workMonth, channel).name} ${project.toUpperCase()}`;
  }

  function openBatchForm() {
    if (!state.loaded) return toast("Still loading, please try again in a moment.", true);
    $("batchForm").reset();
    $("batchFormErr").hidden = true;
    // The month the briefs are written in (this month)
    const d = new Date();
    $("bfMonth").value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    renderBatchRows();
    openModal("batchModal");
    $("bfProject").focus();
  }

  // Inside template literals "//" is written "\/\/": Apps Script treats "//" there as the start of a
  // comment and cuts the rest of the line, which broke the brief link input
  function renderBatchRows() {
    const project = $("bfProject").value, month = $("bfMonth").value, p = state.cfg.projects[project];
    $("bfTeam").innerHTML = p ? `${projectTeam(p)} · Videographer: ${p.videographer ? escapeHtml(p.videographer) : "choose one above"}${channelNote(p)}` : "";
    if (!p || !/^\d{4}-\d{2}$/.test(month)) {
      $("bfRows").innerHTML = `<div class="help">Choose the project and month to see the tasks.</div>`;
      updateBatchForm();
      return;
    }
    const existing = new Set(state.tasks.map(t => t.title.trim().toUpperCase()));
    const types = projectTypes(p).filter(v => !isEventType(v) && !isCollateralType(v));
    const channels = Object.keys(state.cfg.channels).filter(c => !(p.orgOnly && c !== "ORG") && !(p.adsOnly && c !== "ADS"));
    $("bfRows").innerHTML = channels.map(ch => `<div class="batch-group">
      <div class="batch-head">
        <span class="chan chan-${ch.toLowerCase()}">${ch}</span>
        <span class="batch-for">for ${contentMonth(month, ch).name} ${contentMonth(month, ch).year}</span>
        <input data-blink="${ch}" placeholder="Brief ${ch} link (optional now)" aria-label="Brief link for ${ch}">
      </div>
      ${types.map(type => {
        const title = batchTitle(project, type, ch, month), dup = existing.has(title);
        return `<label class="batch-row${dup ? " is-dup" : ""}">
          <input type="checkbox" data-bcheck${dup ? "" : " checked"}>
          <span class="cat cat-type-${typeKind(type)}">${TYPE_ICONS[typeKind(type)]} ${escapeHtml(type)}</span>
          <input class="batch-title" data-btitle data-type="${escapeHtml(type)}" data-channel="${ch}" value="${escapeHtml(title)}" aria-label="Title">
          <input type="date" data-bdeadline aria-label="Deadline" value="${escapeHtml($("bfDeadline").value)}">
          ${dup ? `<span class="tag">Already exists</span>` : ""}
        </label>`;
      }).join("")}
    </div>`).join("");
    updateBatchForm();
  }

  function batchRows() {
    return [...document.querySelectorAll("#bfRows .batch-row")].map(row => {
      const title = row.querySelector("[data-btitle]");
      return { row, checked: row.querySelector("[data-bcheck]").checked, title: title.value.trim(), type: title.dataset.type, channel: title.dataset.channel, deadline: row.querySelector("[data-bdeadline]").value };
    });
  }

  function updateBatchForm() {
    const p = state.cfg.projects[$("bfProject").value];
    const rows = batchRows();
    rows.forEach(r => r.row.classList.toggle("off", !r.checked));
    // Projects without a fixed videographer (Makuta) choose one for the month's videos
    $("bfVideographerField").hidden = !(p && !p.videographer && rows.some(r => r.checked && isVideoType(r.type)));
    const n = rows.filter(r => r.checked).length;
    $("batchSaveBtn").textContent = n ? `Create ${plural(n, "Task")}` : "Create Tasks";
  }

  async function submitBatchForm(e) {
    e.preventDefault();
    const project = $("bfProject").value;
    const links = {};
    document.querySelectorAll("#bfRows [data-blink]").forEach(i => links[i.dataset.blink] = i.value.trim() ? normalizeUrl(i.value) : "");
    const rows = batchRows().filter(r => r.checked);
    const badLink = Object.keys(links).find(c => links[c] && !isValidUrl(links[c]));
    const problem = !project ? ["bfProject", "Please choose the project."]
      : !/^\d{4}-\d{2}$/.test($("bfMonth").value) ? ["bfMonth", "Please choose the month."]
      : !rows.length ? ["bfProject", "Tick at least one task."]
      : rows.some(r => !r.title) ? ["bfRows", "Every ticked task needs a title."]
      : !$("bfVideographerField").hidden && !$("bfVideographer").value ? ["bfVideographer", `Please choose the videographer (${state.cfg.videographers.join(" or ")}).`]
      : badLink ? [`bfRows`, `The ${badLink} brief link is not valid. Fix it or leave it empty.`]
      : null;
    $("batchFormErr").hidden = !problem;
    if (problem) {
      $("batchFormErr").textContent = problem[1];
      $(problem[0]).focus();
      return;
    }
    const list = rows.map(r => ({ title: r.title, project, type: r.type, deadline: r.deadline, briefLink: links[r.channel] || "",
      videographer: isVideoType(r.type) ? $("bfVideographer").value : "" }));
    $("batchSaveBtn").disabled = true;
    try {
      const saved = await api("addTasks", list, $("bfMonth").value);
      saved.forEach(t => {
        const i = state.tasks.findIndex(x => x.id === t.id);
        if (i >= 0) state.tasks[i] = t; else state.tasks.push(t);
      });
      refreshTaskProjects();
      renderTasks();
      closeModal("batchModal");
      toast(`${plural(saved.length, "task")} created for ${project}`);
    } catch (err) {
      $("batchFormErr").textContent = "Save failed: " + err.message;
      $("batchFormErr").hidden = false;
    } finally {
      $("batchSaveBtn").disabled = false;
    }
  }

  /* ---------- Milestones: filtering ---------- */
  function resetTaskFilters(rerender = true) {
    ["tSearch", "tProject", "tMonth"].forEach(id => $(id).value = "");
    $("tStep").value = defaultStep();
    if (rerender) renderTasks();
  }

  // Also used from Home, so it opens Milestones
  function applyTaskStat(kind, project = "") {
    resetTaskFilters(false);
    $("tStep").value = kind;
    $("tProject").value = project;
    if (state.page === "tasks") renderTasks(); else showView("tasks");
  }

  function getFilteredTasks() {
    const q = $("tSearch").value.trim().toLowerCase();
    const proj = $("tProject").value, month = $("tMonth").value, step = STEP_GROUPS[$("tStep").value] || STEP_GROUPS.current;
    return state.tasks.filter(t => {
      if (proj && t.project !== proj) return false;
      if (month && taskMonth(t) !== month) return false;
      if (!step.test(t)) return false;
      // ORG, ADS, Collateral, Event Attribute, Video... are all found by typing them
      if (q) {
        const people = t.steps.map(k => stageOwner(stageOf(k), t));
        const haystack = [t.title, t.project, t.type, t.item, t.channel, t.notes, t.briefLink, t.resultLink, ...people].join(" ").toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });
  }

  /* ---------- Milestones: rendering ---------- */
  const shortDate = iso => new Date(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
  // How long a task has been at its current step: "today", "1 day", "4 days"
  function sinceText(iso) {
    const d = Math.floor((Date.now() - new Date(iso)) / 864e5);
    return d <= 0 ? "today" : plural(d, "day");
  }
  // The newest history entry matching fn
  const lastEntry = (t, fn) => [...t.history].reverse().find(fn);
  // When the task reached its last step ("" while it is not done)
  const finishedAt = t => t.stage === "done" ? ((lastEntry(t, e => e.to === "done") || {}).at || t.updatedAt) : "";
  const daysSince = iso => iso ? (Date.now() - new Date(iso)) / 864e5 : Infinity;

  // Deadline as one pill (date included), so nothing under the title is left without a background
  function taskDue(t) {
    if (!t.deadline) return "";
    const date = formatDay(t.deadline);
    if (t.stage === "done") return `<span class="due due-done">📅 ${date}</span>`;
    const d = daysUntil(t.deadline);
    if (d < 0) return `<span class="due due-overdue">⚠️ Overdue ${plural(-d, "day")} · ${date}</span>`;
    if (d <= 3) return `<span class="due due-soon">⏰ ${d === 0 ? "Due today" : d === 1 ? "Due tomorrow" : `In ${d} days`} · ${date}</span>`;
    return `<span class="due">📅 ${date}</span>`;
  }

  // The revision still being worked on: from the latest revision request until that QC step approves again
  function openRevision(t) {
    const i = t.history.map(e => e.action).lastIndexOf("revision");
    if (i < 0) return null;
    const r = t.history[i];
    return t.history.slice(i + 1).some(e => e.from === r.from && e.action === "approved") ? null : r;
  }

  function stepper(t) {
    // Once the client has asked for a revision, the content writer's "Client Revision" step stays in the timeline,
    // just before the step it was passed on to (or the first step that could fix it)
    const shown = [...t.steps];
    if (t.history.some(e => e.action === "revision" && e.to === "revision")) {
      const assigned = t.stage === "revision" ? null : lastEntry(t, e => e.action === "assign");
      shown.splice(shown.indexOf(assigned ? assigned.to : fixSteps(t)[0]), 0, "revision");
    }
    const cur = shown.indexOf(t.stage);
    const finished = t.stage === "done";
    const entered = lastEntry(t, e => e.to === t.stage);
    // While a revision is open, every step from where it was sent back up to the QC that asked for it is red
    const rev = openRevision(t);
    const redFrom = rev ? shown.indexOf(rev.to) : -1, redTo = rev ? shown.indexOf(rev.from) : -1;
    const steps = shown.map((k, i) => {
      const s = stageOf(k);
      const st = finished || i < cur ? "done" : i === cur ? "current" : "todo";
      const red = rev && i >= redFrom && i <= redTo;
      const doneAt = st === "done" && lastEntry(t, e => e.from === k && ["done", "approved", "assign"].includes(e.action));
      const revs = t.history.filter(e => (k === "revision" ? e.to : e.from) === k && e.action === "revision").length;
      const when = doneAt ? shortDate(doneAt.at) : st === "current" ? `Now${entered ? ` · ${sinceText(entered.at)}` : ""}` : "";
      // Drafting Brief opens the brief, Design / Motion the result
      const url = t[state.cfg.linkSteps[k]];
      return `<li class="ms-step ms-${st}${s.qc ? " ms-qc" : ""}${red ? " ms-red" : ""}${red && i === redFrom ? " ms-red-start" : ""}">
        <span class="dot">${st === "done" ? "✓" : s.qc ? "QC" : i + 1}</span>
        ${url ? `<a class="ms-name ms-link" href="${safeHref(url)}" target="_blank" rel="noopener" title="Open the ${k === "brief" ? "brief" : "result"}">${escapeHtml(s.name)}&nbsp;↗</a>` : `<span class="ms-name">${escapeHtml(s.name)}</span>`}
        <span class="ms-owner">${escapeHtml(stageOwner(s, t))}</span>
        <span class="ms-date">${when}${revs ? ` <b class="rev">↺ ${revs}</b>` : ""}</span>
      </li>`;
    }).join("");
    const end = finished ? lastEntry(t, e => e.to === "done") : null;
    return `<ol class="stepper">${steps}
      <li class="ms-step ms-${finished ? "done" : "todo"} ms-finish">
        <span class="dot">🏁</span><span class="ms-name">${doneLabel(t)}</span><span class="ms-date">${end ? shortDate(end.at) : ""}</span>
      </li></ol>`;
  }

  function historyList(t) {
    const text = e => {
      const from = escapeHtml(stageOf(e.from).name), to = e.to === "done" ? doneLabel(t) : escapeHtml(stageOf(e.to).name);
      if (e.action === "created") return "Task created";
      if (e.action === "approved") return `✅ <b>${from}</b> approved → ${to}`;
      if (e.action === "revision") return `↺ <b>${from}</b> asked for a revision → back to ${to}`;
      if (e.action === "assign") return `↪ <b>${from}</b> passed to ${to} (${escapeHtml(stageOwner(stageOf(e.to), t))})`;
      return `✔ <b>${from}</b> done → ${to}`;
    };
    // Who made the move (moves saved before logins existed have no name)
    const by = e => e.by ? ` <span class="muted">· by ${escapeHtml(e.by)}</span>` : "";
    // The link handed on with that step (earlier versions of a result stay here after a revision)
    const link = e => e.link ? ` · <a href="${safeHref(e.link)}" target="_blank" rel="noopener">${e.from === "brief" ? "brief" : "result"} ↗</a>` : "";
    const open = state.openHistory.has(t.id) ? " open" : "";
    return `<details class="history" data-id="${escapeHtml(t.id)}"${open}>
      <summary>History (${t.history.length})</summary>
      <ul>${[...t.history].reverse().map(e => `<li><span class="muted">${formatDate(e.at)}</span> ${text(e)}${link(e)}${by(e)}${e.note ? `<div class="note">"${escapeHtml(e.note)}"</div>` : ""}</li>`).join("")}</ul>
    </details>`;
  }

  function taskCard(t) {
    const id = escapeHtml(t.id);
    const done = t.stage === "done";
    // While a revision is open, keep showing what was asked
    const rev = openRevision(t);
    const revisionNote = rev
      ? `<div class="rev-banner">↺ Revision requested at <b>${escapeHtml(stageOf(rev.from).name)}</b>${rev.note ? `: "${escapeHtml(rev.note)}"` : ""}</div>` : "";
    const totalRevs = t.history.filter(e => e.action === "revision").length;
    const main = stepButtons(t);
    const overdue = t.deadline && !done && t.deadline < today();
    // The task that was just moved animates its new step once
    return `<article class="task${overdue ? " row-overdue" : ""}${done ? " task-done" : ""}${t.id === state.justMoved ? " task-moved" : ""}" data-task="${id}">
      <div class="task-head">
        <div class="task-title">
          <strong>${escapeHtml(t.title)}</strong>
          <div class="meta-line">
            ${t.channel ? `<span class="chan chan-${t.channel === "ADS" ? "ads" : "org"}">${escapeHtml(t.channel)}</span>` : ""}
            <span class="cat cat-type-${typeKind(t.type)}">${TYPE_ICONS[typeKind(t.type)]} ${escapeHtml(t.type)}${t.item ? `: ${escapeHtml(t.item)}` : ""}</span>
            ${t.videographer ? `<span class="tag">🎥 VG-${escapeHtml(t.videographer)}</span>` : ""}
            ${done ? `<span class="tag tag-finished">✓ Completed ${shortDate(finishedAt(t))}</span>` : ""}
            ${taskDue(t)}
            ${totalRevs ? `<span class="tag tag-rev">↺ ${plural(totalRevs, "revision")}</span>` : ""}
            ${t.workMonth ? "" : linkTag(t, "briefLink")}
            ${linkTag(t, "resultLink")}
          </div>
        </div>
      </div>
      ${revisionNote}
      <div class="stepper-wrap">${stepper(t)}</div>
      ${isEventType(t.type) ? eventChecklist(t) : ""}
      ${t.notes ? `<p class="desc task-notes">${escapeHtml(t.notes)}</p>` : ""}
      <div class="task-actions">
        <div class="row-actions">${main}</div>
        <div class="row-actions">
          ${t.history.length > 1 && canUndo(t) ? `<button class="btn-sm btn-soft" data-tact="undo" data-id="${id}" title="Take back the last step">Undo</button>` : ""}
          ${done || !managesProject(t.project) ? "" : `<button class="btn-sm btn-soft" data-tact="edit" data-id="${id}">Edit</button>`}
          ${managesProject(t.project) ? `<button class="btn-sm btn-danger" data-tact="delete" data-id="${id}">Delete</button>` : ""}
        </div>
      </div>
      ${historyList(t)}
    </article>`;
  }

  // The buttons of the task's current step. Only the person whose step it is (or managerial) gets them;
  // everyone else sees who it waits for.
  function stepButtons(t) {
    const id = escapeHtml(t.id), s = stageOf(t.stage);
    const FIX_LABELS = { video: "Videographer (CTC)", design: "Graphic Designer", motion: "Graphic Designer (Motion / ToV)" };
    const together = togetherLabel(t);
    const both = together ? ` <span class="together" title="Moves every task listed here together">· ${escapeHtml(together)}</span>` : "";
    return t.stage === "done" ? ""
      : !canPress(t) ? `<span class="waiting">⏳ Waiting for <b>${escapeHtml(waitingFor(t))}</b></span>${workLink(t)}`
      : workLink(t) + (t.stage === "revision"
      ? fixSteps(t).map(k => `<button class="btn-sm btn-accent" data-tact="assign" data-to="${k}" data-id="${id}">Send to ${FIX_LABELS[k]}: ${escapeHtml(stageOwner(stageOf(k), t))} →</button>`).join("")
      : s.qc
      ? `<button class="btn-sm btn-ok" data-tact="advance" data-id="${id}">✓ Approve${both}</button>
         <button class="btn-sm btn-danger" data-tact="revise" data-id="${id}">↺ Request Revision</button>`
      : `<button class="btn-sm btn-accent" data-tact="advance" data-id="${id}">${escapeHtml(s.action || "Mark as Done")}${both} →</button>`);
  }

  // Event Attribute deliverables, ticked off one by one (saved right away)
  function eventChecklist(t) {
    const items = state.cfg.eventItems;
    const done = items.filter(i => t.checklist.includes(i.name)).length;
    return `<div class="checklist">
      <span class="checklist-head">Event deliverables · ${done}/${items.length}</span>
      ${items.map(i => `<label class="check-item${t.checklist.includes(i.name) ? " on" : ""}${state.justTicked === t.id + "|" + i.name ? " just-ticked" : ""}">
        <input type="checkbox" data-titem="${escapeHtml(i.name)}" data-id="${escapeHtml(t.id)}"${t.checklist.includes(i.name) ? " checked" : ""}${t.stage === "done" || !canTick(t) ? " disabled" : ""}>${escapeHtml(eventItemLabel(i, t.deadline))}</label>`).join("")}
    </div>`;
  }

  // The sidebar and Home follow every change
  function renderTasks() {
    if (!state.loaded) return;
    renderSideProjects();
    if (state.page === "home") renderHome();
    ["tSearch", "tProject", "tMonth"].forEach(id => $(id).classList.toggle("is-active", !!$(id).value));
    $("tStep").classList.toggle("is-active", $("tStep").value !== defaultStep());
    updateFilterToggle("viewTasks");
    const list = getFilteredTasks();
    $("taskCount").innerHTML = `Showing <b>${list.length}</b> of ${plural(state.tasks.length, "task")}`;
    if (!list.length) {
      $("taskResults").innerHTML = `<div class="empty">${state.tasks.length
        ? `<div class="empty-emoji">🔍</div><strong>No tasks match these filters.</strong><br><a href="#" onclick="resetTaskFilters(); return false;">Reset filters</a>`
        : `<div class="empty-emoji">🗂️</div><strong>No tasks yet.</strong><br><a href="#" onclick="openTaskForm(); return false;">Create your first task</a>`}</div>`;
      return;
    }
    const groups = {};
    list.forEach(t => (groups[t.project] = groups[t.project] || []).push(t));
    // Inside a project: unfinished first, newest task on top; finished ones by when they finished, newest first
    const sorter = (a, b) => ((a.stage === "done") - (b.stage === "done")) || finishedAt(b).localeCompare(finishedAt(a)) ||
      (b.createdAt || "").localeCompare(a.createdAt || "");
    Object.values(groups).forEach(items => items.sort(sorter));
    // The project with the newest task comes first
    const newest = name => groups[name].reduce((m, t) => (t.createdAt || "") > m ? t.createdAt : m, "");
    const order = taskProjects().filter(p => groups[p]).sort((a, b) => newest(b).localeCompare(newest(a)));
    $("taskResults").innerHTML = order.map(name => {
      const items = groups[name];
      const active = items.filter(t => t.stage !== "done").length;
      const p = state.cfg.projects[name] || {};
      return `<section class="group">
        <div class="group-head">
          <h3>${projectAvatar(name)}${escapeHtml(name)}</h3>
          <span>${plural(items.length, "task")} &middot; ${active} active${p.designer ? ` &middot; ${projectTeam(p)}` : ""}${channelNote(p).replace(" · ", " &middot; ")}</span>
        </div>
        ${projectCards(items)}
      </section>`;
    }).join("");
  }

  // Monthly Brief tasks are shown together per brief (one channel of one working month), Static on top
  // and the video below; other tasks are shown on their own
  function projectCards(items) {
    const shown = new Set();
    return items.map(t => {
