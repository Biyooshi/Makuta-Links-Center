<style>
  /* Theme tokens: light by default, dark via [data-theme="dark"] */
  :root {
    --app-bg: #f4f6fa;
    --ink: #14213d;
    --ink-text: #c9d3e6;
    --ink-muted: #8794b0;
    --card-bg: #ffffff;
    --panel-bg: #f6f7fb;
    --text: #1f2937;
    --muted: #6b7280;
    --heading: #233a66;
    --border: #d6dce6;
    --box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 3px 10px rgba(15, 23, 42, .06);
    --input-bg: #ffffff;
    --accent: #d99a2b;
    --accent-hover: #c2861d;
    --accent-soft: #fdf3e1;
    --primary: #2f4f8a;
    --primary-hover: #233e70;
    --primary-soft: #e8eef8;
    --danger: #c62828;
    --danger-soft: #fdecec;
    --success: #16a34a;
    --warn-bg: #fefce8;
    --warn-border: #eab308;
    --warn-text: #854d0e;
    --row-overdue: #fff5f5;
    --row-pinned: #fffbf0;
    --shadow: 0 24px 48px rgba(10, 20, 40, .25);
    /* Pills: background = --c mixed into --badge-mix; text = --c mixed into --badge-text-mix */
    --badge-mix: white;
    --badge-c: 14%;
    --badge-text-mix: black;
    --badge-text-c: 85%;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --app-bg: #0f1726;
    --ink: #0a1120;
    --ink-text: #b8c3d9;
    --ink-muted: #7683a0;
    --card-bg: #1a2436;
    --panel-bg: #222e43;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --heading: #a5c0f5;
    --border: #3c4b65;
    --box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .28);
    --input-bg: #2a374e;
    --accent: #e8ad45;
    --accent-hover: #f0bd60;
    --accent-soft: rgba(232, 173, 69, .14);
    --primary: #4a72bd;
    --primary-hover: #5a83cf;
    --primary-soft: rgba(74, 114, 189, .2);
    --danger: #f87171;
    --danger-soft: rgba(239, 68, 68, .16);
    --success: #22c55e;
    --warn-bg: rgba(234, 179, 8, .12);
    --warn-border: #eab308;
    --warn-text: #fde68a;
    --row-overdue: rgba(239, 68, 68, .08);
    --row-pinned: rgba(232, 173, 69, .07);
    --shadow: 0 24px 48px rgba(0, 0, 0, .5);
    --badge-mix: #1a2436;
    --badge-c: 24%;
    --badge-text-mix: white;
    --badge-text-c: 55%;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    font-family: "Poppins", "Segoe UI", Arial, sans-serif;
    background: var(--app-bg);
    color: var(--text);
    min-height: 100vh;
  }
  svg.icon { width: 1em; height: 1em; vertical-align: -0.125em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .muted { color: var(--muted); }
  .text-danger { color: var(--danger); }

  /* App shell: navy sidebar on the left, the work on a light page to the right */
  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px;
    padding: 20px 14px; background: var(--ink); color: var(--ink-text); overflow-y: auto; z-index: 30;
    border-right: 1px solid rgba(255, 255, 255, .06);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 6px; }
  .brand .crown { font-size: 26px; line-height: 1; }
  .brand-name { display: flex; flex-direction: column; font-size: 17px; font-weight: 700; color: #fff; line-height: 1.15; }
  .brand-name small { font-size: 12px; font-weight: 500; color: var(--ink-muted); }
  .side-nav, .side-projects { display: flex; flex-direction: column; gap: 2px; }
  .side-nav button, .side-project, .side-btn {
    position: relative; justify-content: flex-start; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 10px;
    background: none; color: var(--ink-text); font-weight: 500; font-size: 14px; text-align: left;
  }
  .side-nav button:hover, .side-project:hover, .side-btn:hover { background: rgba(255, 255, 255, .07); color: #fff; }
  .side-nav button.active, .side-project.active { background: rgba(255, 255, 255, .1); color: #fff; font-weight: 600; }
  /* The gold edge marks where you are */
  .side-nav button.active::before, .side-project.active::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
  .side-nav .icon { font-size: 18px; flex-shrink: 0; }
  .side-title { padding: 0 12px 6px; font-size: 12px; font-weight: 600; color: var(--ink-muted); }
  .side-project { padding: 8px 12px; font-size: 13px; }
  .side-icon { width: 20px; text-align: center; flex-shrink: 0; }
  .nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-count { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: rgba(255, 255, 255, .1); font-size: 11px; font-weight: 600; text-align: center; color: var(--ink-text); }
  .side-nav .nav-count { background: var(--accent); color: var(--ink); }
  .turn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; box-shadow: 0 0 0 3px rgba(217, 154, 43, .25); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, .1); }
  .user-chip { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
  .user-avatar { width: 34px; height: 34px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent); color: var(--ink); font-weight: 700; }
  .user-text { display: flex; flex-direction: column; min-width: 0; font-size: 14px; color: #fff; line-height: 1.3; }
  .user-text span { font-size: 12px; color: var(--ink-muted); }
  .side-actions { display: flex; gap: 4px; }
  .side-btn { width: auto; flex: 1; justify-content: center; padding: 8px; font-size: 13px; }
  .side-btn.theme-toggle { flex: 0 0 auto; }
  /* Laptops: the button next to the name makes the sidebar a rail of icons (tablets always have the rail) */
  .app { transition: grid-template-columns .2s ease; }
  .side-collapse { margin-left: auto; width: 32px; height: 32px; padding: 0; flex-shrink: 0; background: none; color: var(--ink-muted); border-radius: 8px; font-size: 18px; }
  .side-collapse:hover { background: rgba(255, 255, 255, .07); color: #fff; }
  /* The Sheet link is an <a class="btn">; keep it looking like the other sidebar buttons */
  a.side-btn { background: none; color: var(--ink-text); box-shadow: none; text-decoration: none; }
  a.side-btn:hover { background: rgba(255, 255, 255, .07); color: #fff; transform: none; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 14px 32px; background: color-mix(in srgb, var(--app-bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  .topbar h1 { flex: 1; font-size: 22px; font-weight: 700; color: var(--heading); }
  .icon-btn { width: 40px; height: 40px; padding: 0; background: none; color: var(--heading); border-radius: 10px; font-size: 20px; }
  .icon-btn:hover { background: var(--primary-soft); }
  .menu-btn { display: none; }
  .new-wrap { position: relative; }
  .new-btn .icon { font-size: 16px; }
  .new-menu {
    position: absolute; right: 0; top: calc(100% + 8px); width: 280px; padding: 6px; border-radius: 14px;
    background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--shadow); z-index: 45;
  }
  .new-menu button { display: flex; flex-direction: column; align-items: flex-start; gap: 0; width: 100%; padding: 10px 12px; border-radius: 10px; background: none; color: var(--text); text-align: left; }
  .new-menu button:hover { background: var(--primary-soft); }
  .new-menu b { color: var(--heading); font-size: 14px; }
  .new-menu span { font-size: 12px; font-weight: 400; color: var(--muted); }
  .content { padding: 28px 32px; width: 100%; max-width: 1360px; flex: 1; }
  .scrim { display: none; }
  .bottom-nav { display: none; }

  /* Add / edit link: a side panel over the page */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 38; width: min(620px, 100%); overflow-y: auto;
    padding: 0 24px 24px; background: var(--app-bg); box-shadow: var(--shadow); animation: slide-in .22s ease-out;
  }
  @keyframes slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .drawer-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; margin: 0 -24px 16px; padding: 14px 16px 14px 24px; background: var(--app-bg); border-bottom: 1px solid var(--border); }
  .drawer-head h2 { font-size: 18px; color: var(--heading); }
  body.drawer-open .scrim, body.sidebar-open .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(5, 10, 25, .45); }
  body.drawer-open .scrim { z-index: 37; }

  /* Home: a greeting, four numbers, what is waiting for me, then each project by stage */
  .home-hello { margin-bottom: 18px; }
  .home-hello h2 { font-size: 22px; color: var(--heading); }
  .home-hello p { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .home-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
  .home-stat {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 16px; text-align: left;
    background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px; font-weight: 400;
  }
  .home-stat:hover { background: var(--card-bg); border-color: var(--accent); }
  .stat-n { font-size: 28px; font-weight: 700; line-height: 1.1; color: var(--heading); }
  .stat-label { font-size: 14px; font-weight: 600; color: var(--heading); }
  .stat-note { font-size: 12px; color: var(--muted); }
  .home-stat.tone-accent { border-top: 3px solid var(--accent); }
  .home-stat.tone-accent .stat-n { color: var(--accent); }
  .home-stat.tone-danger { border-top: 3px solid var(--danger); }
  .home-stat.tone-danger .stat-n { color: var(--danger); }
  .home-block { margin-bottom: 28px; }
  .block-head { display: flex; align-items: baseline; gap: 10px; }
  .block-head h3 { font-size: 17px; color: var(--heading); }
  .turn-count { font-size: 13px; color: var(--muted); }
  .block-note { margin: 2px 0 12px; font-size: 13px; color: var(--muted); }
  .block-head + div, .block-head + ul { margin-top: 10px; }
  .turn-row {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 8px;
    background: var(--card-bg); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 12px;
  }
  .turn-row.is-late { border-left-color: var(--danger); }
  .turn-open { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 0; background: none; color: var(--text); text-align: left; font-weight: 400; }
  .turn-open:hover { background: none; }
  .turn-open:hover .turn-title { text-decoration: underline; }
  .turn-title { font-size: 15px; font-weight: 600; color: var(--heading); overflow-wrap: anywhere; }
  .turn-meta { font-size: 13px; color: var(--muted); }
  .turn-meta b { color: var(--text); font-weight: 600; }
  .turn-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .turn-empty { padding: 22px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); font-size: 14px; }
  /* Projects by stage: a table on wide pages, one card per project on narrow ones */
  .proj-table { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .proj-row { display: grid; grid-template-columns: minmax(150px, 1.6fr) repeat(6, minmax(0, 1fr)); align-items: center; }
  .proj-row + .proj-row { border-top: 1px solid var(--border); }
  .proj-head { background: var(--panel-bg); font-size: 12px; font-weight: 600; color: var(--muted); }
  .proj-head span { padding: 10px 8px; text-align: center; }
  .proj-head span:first-child { padding-left: 16px; text-align: left; }
  .proj-name { display: flex; justify-content: flex-start; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 12px 16px; background: none; color: var(--heading); font-size: 14px; font-weight: 600; text-align: left; border-radius: 0; }
  .proj-name small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .proj-name:hover { background: var(--primary-soft); }
  .proj-cell { display: flex; justify-content: center; padding: 8px; }
  .stage-n { min-width: 36px; height: 30px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 14px; font-weight: 600; }
  button.stage-n { background: var(--primary-soft); color: var(--heading); }
  button.stage-n:hover { background: var(--accent); color: #fff; }
  button.stage-n.is-late { background: var(--danger); color: #fff; }
  .stage-n.is-zero { color: var(--muted); opacity: .5; font-weight: 400; }
  .home-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  .home-list { list-style: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .home-list li + li { border-top: 1px solid var(--border); }
  .home-list button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; padding: 11px 14px; border-radius: 0; background: none; color: var(--text); font-weight: 400; font-size: 13px; text-align: left; }
  .home-list button:hover { background: var(--primary-soft); }
  .home-item { font-weight: 600; color: var(--heading); overflow-wrap: anywhere; }
  .home-item b { font-weight: 700; }
  .home-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .home-empty { padding: 16px; font-size: 13px; color: var(--muted); background: var(--card-bg); border: 1px dashed var(--border); border-radius: 12px; }
  /* A task opened from Home lights up once */
  .task-flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: inset 0 0 0 3px var(--accent); } 100% { box-shadow: inset 0 0 0 0 transparent; } }

  /* Buttons */
  button, .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px; border: none; border-radius: 8px;
    font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; text-decoration: none; transition: background .2s, transform .1s, box-shadow .2s;
    background: var(--primary); color: #fff;
  }
  button:hover, .btn:hover { background: var(--primary-hover); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: wait; }
  .btn-soft { background: var(--primary-soft); color: var(--heading); box-shadow: inset 0 0 0 1px var(--border); }
  .btn-soft:hover { background: var(--border); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-danger-solid { background: #dc2626; color: #fff; }
  .btn-danger-solid:hover { background: #b91c1c; }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .btn-block { width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; box-shadow: 0 6px 16px rgba(217, 154, 43, .3); }
  .btn-block:hover { box-shadow: 0 8px 20px rgba(217, 154, 43, .4); }
  .theme-toggle .moon { display: inline; }
  .theme-toggle .sun { display: none; }
  [data-theme="dark"] .theme-toggle .moon { display: none; }
  [data-theme="dark"] .theme-toggle .sun { display: inline; }

  /* Form */
  .edit-banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--primary-soft); color: var(--heading); border-left: 4px solid var(--primary); border-radius: 0 10px 10px 0; padding: 10px 14px; margin-bottom: 20px; font-size: 14px; }
  .section { margin-bottom: 20px; padding: 20px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--box-shadow); }
  .section h3 { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; color: var(--heading); font-size: 17px; font-weight: 700; margin-bottom: 16px; }
  .section h3 small { width: 100%; padding-left: 38px; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: -4px; }
  .step { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; margin-bottom: 16px; }
  .grid-2 .field { margin-bottom: 0; }
  .grid-2 + .field { margin-top: 16px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .req { color: var(--danger); }
  .help { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .help.help-top { margin: -2px 0 8px; }
  input, select, textarea {
    width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; font-size: 14px; background: var(--input-bg); color: var(--text);
    transition: border-color .2s, box-shadow .2s;
  }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
  input:hover, select:hover, textarea:hover { border-color: var(--muted); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; min-height: 110px; }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .error { color: var(--danger); font-size: 12px; margin-top: 4px; font-weight: 500; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .reset-link { background: none; color: var(--muted); font-weight: 400; font-size: 12px; padding: 2px; text-decoration: underline; }
  .reset-link:hover { background: none; color: var(--text); }
  input[readonly] { background: var(--panel-bg); color: var(--muted); cursor: not-allowed; }
  .sub-field { margin-top: 10px; padding-left: 12px; border-left: 3px solid var(--accent-soft); }
  .version-row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; margin-bottom: 8px; }
  .version-row input { padding: 9px 10px; }
  .warn { margin-top: 10px; background: var(--warn-bg); border-left: 4px solid var(--warn-border); color: var(--warn-text); border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 13px; }
  .warn strong::before { content: "⚠️ "; }
  .warn p { margin: 4px 0 10px; }

  /* Modals */
  .modal-bg { position: fixed; inset: 0; background: rgba(5, 10, 25, .55); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--card-bg); border-radius: 18px; padding: 32px; text-align: center; max-width: 420px; width: 100%; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; animation: pop .2s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal.modal-left { text-align: left; max-width: 520px; }
  .modal .check { font-size: 60px; color: var(--success); line-height: 1; margin-bottom: 14px; }
  .modal-emoji { font-size: 40px; margin-bottom: 8px; }
  .modal-lock { background: rgba(5, 10, 25, .85); }
  .modal-lock .error { text-align: left; }
  .lock-btn { margin-top: 14px; }
  /* Passcode field with a show / hide (eye) button inside it */
  .lock-user { margin-bottom: 10px; }
  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 46px; }
  .pass-eye { position: absolute; top: 6px; bottom: 6px; right: 6px; padding: 0 8px; background: none; color: var(--muted); font-size: 18px; border-radius: 6px; }
  .pass-eye:not(:disabled):hover { background: var(--primary-soft); color: var(--heading); }
  .pass-eye, .pass-eye:hover, .pass-eye:active { transform: none !important; }
  .pass-eye .eye-closed, .pass-eye.on .eye-open { display: none; }
  .pass-eye.on .eye-closed { display: inline; }
  .modal h3 { color: var(--heading); font-size: 20px; margin-bottom: 8px; }
  .modal p { color: var(--muted); font-size: 14px; margin-bottom: 20px; word-break: break-word; }
  .modal p.small { font-size: 12px; margin: 16px 0 6px; }
  .modal textarea { min-height: 0; }
  .modal .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .modal.modal-left .actions { justify-content: flex-end; }


  /* Filters */
  .filter-panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: var(--box-shadow); }
  .search-box { position: relative; margin-bottom: 12px; }
  .search-box .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search-box input { padding-left: 38px; }
  .filters { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .filters .field { margin-bottom: 0; }
  .filters.filters-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .filters input, .filters select { padding: 9px 10px; }
  .filter-toggle { display: none; float: right; margin: 0 0 0 8px; height: 46px; }
  .filter-panel .is-active { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
  .meta-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
  .meta-bar b { color: var(--text); }
  .filter-note { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }
  .meta-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .meta-bar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: var(--box-shadow); }
  .segmented button { border-radius: 0; background: none; color: var(--muted); padding: 6px 12px; font-size: 13px; }
  .segmented button:hover { background: var(--panel-bg); }
  .segmented button.active { background: var(--accent); color: #fff; }

  /* Table */
  .table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--box-shadow); }
  .links-table { table-layout: fixed; }
  .links-table .c-pin { width: 44px; }
  .links-table .c-cat { width: 172px; }
  .links-table .c-proj { width: 136px; }
  .links-table .c-act { width: 120px; }
  .links-table .c-link { width: 130px; }
  .link-task { padding: 0; background: none; color: var(--heading); font-size: 14px; font-weight: 600; text-align: left; border-radius: 0; overflow-wrap: anywhere; }
  .link-task:hover { background: none; text-decoration: underline; }
  .link-meta { margin-top: 4px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .link-desc { color: var(--text); white-space: pre-wrap; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .links-table th, .links-table td { padding: 12px 8px; overflow-wrap: anywhere; }
  .links-table th:first-child, .links-table td:first-child { padding-left: 12px; }
  .links-table th:last-child, .links-table td:last-child { padding-right: 12px; }
  .links-table th { white-space: normal; }
  /* Pills may wrap between words, never inside one */
  .links-table .cat, .links-table .due { white-space: normal; overflow-wrap: normal; max-width: 100%; }
  .links-table .proj { font-size: 12px; }
  .links-table .cat { white-space: nowrap; }
  .links-table .desc { min-width: 0; max-width: none; }
  .links-table .row-actions { flex-direction: row; gap: 4px; }
  .links-table .row-actions button { width: 32px; height: 32px; padding: 0; }
  .links-table .act-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .row-actions button { gap: 5px; }
  .links-table .proj { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  th { background: var(--panel-bg); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  tbody tr { transition: background .15s; }
  tbody tr.row-pinned { background: var(--row-pinned); }
  tbody tr:hover { background: var(--panel-bg); }
  .title-cell { min-width: 0; }
  a.main-link { display: block; color: var(--primary); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.main-link:hover { color: var(--accent); }
  [data-theme="dark"] a.main-link { color: var(--heading); }
  .group-item a.main-link { max-width: 100%; }
  .row-actions { display: flex; flex-direction: column; gap: 4px; }
  .group-item .row-actions { flex-direction: row; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); text-decoration: none; }
  .chip::before { content: "↗ "; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .desc { color: var(--muted); min-width: 140px; max-width: 200px; white-space: pre-wrap; word-break: break-word; }
  .nowrap { white-space: nowrap; }

  /* Colored pills: each sets --c, the rest is shared */
  .cat, .due, .tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
    background: color-mix(in srgb, var(--c) var(--badge-c), var(--badge-mix));
    color: color-mix(in srgb, var(--c) var(--badge-text-c), var(--badge-text-mix));
  }
  .cat, .tag { --c: #64748b; }
  .tag-rev { --c: #dc2626; }
  .tag-finished { --c: #16a34a; }
  .tag-link { --c: #2563eb; text-decoration: none; }
  .tag-link:hover { text-decoration: underline; }
  /* The brief or result the current step works from, next to its buttons */
  a.link-open { text-decoration: none; }
  /* Drafting Brief, Design and Motion open their link from the timeline */
  a.ms-link { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
  a.ms-link:hover { color: var(--accent); }

  /* Resources: two tabs; the filters and buttons that only fit the resources hide on the other tab */
  .page-tabs { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 8px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; }
  .page-tabs button { padding: 7px 14px; background: none; color: var(--muted); font-size: 14px; border-radius: 9px; }
  .page-tabs button:hover { background: var(--card-bg); color: var(--text); }
  .page-tabs button.active { background: var(--card-bg); color: var(--heading); font-weight: 600; box-shadow: var(--box-shadow); }
  #viewLinks.tab-tasks .res-only { display: none !important; }
  .cat-google-docs { --c: #2563eb; }
  .cat-google-spreadsheets { --c: #16a34a; }
  .cat-google-slide { --c: #ea580c; }
  .cat-drive-folder { --c: #ca8a04; }
  .cat-ctc-video { --c: #db2777; }
  .cat-reference { --c: #9333ea; }
  .cat-type-static { --c: #ea580c; }
  .cat-type-video { --c: #db2777; }
  .cat-type-event { --c: #0d9488; }
  .cat-type-collateral { --c: #4f46e5; }
  .due { --c: #64748b; font-weight: 600; }
  .due-soon { --c: #d97706; }
  .due-overdue { --c: #dc2626; }
  .due-done { --c: #16a34a; }

  /* Project chip + avatar: color comes from --h (hue), set per project */
  .proj { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; white-space: nowrap; background: hsl(var(--h) 60% 50% / .14); }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; margin-right: 10px; background: hsl(var(--h) 60% 50% / .18); font-size: 17px; }
  .avatar-none { background: var(--muted); }

  .pin { background: none; color: var(--border); font-size: 20px; padding: 0 4px; line-height: 1; }
  .pin:hover { background: none; color: var(--accent); transform: scale(1.15); }
  .pin.on { color: var(--accent); }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; line-height: 1.8; }
  .empty strong { color: var(--text); }
  .empty a { color: var(--accent); font-weight: 600; }
  .empty-emoji { font-size: 40px; line-height: 1.2; margin-bottom: 6px; }
  .loading { text-align: center; padding: 48px 16px; color: var(--muted); }
  .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* By Project view */
  .group { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; box-shadow: var(--box-shadow); }
  .group-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; background: var(--panel-bg); border-bottom: 1px solid var(--border); }
  .group-head + * { border-top: none; }
  .group-head h3 { display: flex; align-items: center; font-size: 16px; color: var(--heading); }
  .group-head > span { font-size: 12px; color: var(--muted); }
  .group-item { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-top: 1px solid var(--border); }
  .group-item.row-pinned { background: var(--row-pinned); }
  .group-item .main { flex: 1; min-width: 0; }
  .group-item .desc { max-width: none; margin-top: 6px; font-size: 13px; }
  .meta-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
  .toast.error { background: #b91c1c; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.has-action.show { pointer-events: auto; display: flex; align-items: center; gap: 14px; }
  .toast-action { padding: 4px 12px; background: var(--accent); color: #fff; font-size: 13px; border-radius: 8px; }
  .toast-action:hover { background: var(--accent-hover); }

  /* Milestones */
  .modal.modal-wide { max-width: 640px; }
  .btn-ok { background: var(--success); color: #fff; }
  .btn-ok:hover { background: #15803d; }
  .chan { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .4px; color: #fff; background: #0891b2; }
  .chan-ads { background: #7c3aed; }
  /* Monthly Brief: one block per channel, one row per task */
  .modal.modal-batch { max-width: 860px; }
  /* Project, month, deadline (and videographer when needed) side by side */
  .batch-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
  .batch-fields .field { margin-bottom: 0; }
  #bfTeam { margin-top: 8px; }
  /* Rows share the group's columns (subgrid), so every type pill, title and date lines up */
  .batch-group { display: grid; grid-template-columns: auto max-content minmax(0, 1fr) 156px; column-gap: 8px; margin-top: 16px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-bg); }
  .batch-head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 8px; }
  .batch-head input { flex: 1 1 260px; min-width: 0; }
  .batch-for { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .batch-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; row-gap: 6px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--border); cursor: pointer; }
  .batch-row input[type=checkbox] { width: 16px; height: 16px; }
  .batch-row .batch-title { font-weight: 600; }
  .batch-row .cat { justify-self: start; }
  .batch-row.off .cat, .batch-row.off input:not([type=checkbox]) { opacity: .45; }
  .batch-row .tag { grid-column: 3 / -1; justify-self: start; }
  /* One brief (channel + month) of a Monthly Brief: its Static and Video tasks together */
  .brief-section { margin: 12px; border: 1px solid var(--border); border-left: 4px solid #0891b2; border-radius: 10px; overflow: hidden; }
  .brief-section:has(.chan-ads) { border-left-color: #7c3aed; }
  .solo-section > .task { border-top: none; }
  .brief-section.solo-static { border-left-color: #ea580c; }
  .brief-section.solo-video { border-left-color: #db2777; }
  .brief-section.solo-event { border-left-color: #0d9488; }
  .brief-section.solo-collateral { border-left-color: #4f46e5; }
  .brief-section.solo-section:has(.task-done) { border-left-color: var(--success); }
  .brief-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel-bg); font-size: 13px; }
  .brief-head .muted { font-size: 12px; }
  .brief-count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
  .together { font-weight: 500; opacity: .85; }
  .revise-channels { display: flex; flex-wrap: wrap; gap: 8px; }
  .task { padding: 16px; border-top: 1px solid var(--border); }
  /* Finished: everything greyed out, only the last step (Scheduled / Posted, Live on Ads) stays green */
  .task.task-done { background: color-mix(in srgb, var(--muted) 7%, transparent); }
  .task-done .task-title > strong, .task-done .meta-line > :not(.tag-finished), .task-done .ms-step:not(.ms-finish), .task-done .checklist, .task-done .task-notes, .task-done .history { filter: grayscale(1); opacity: .45; }
  .task-done .ms-finish .dot { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 30%, transparent); }
  .task-done .ms-finish .ms-name, .task-done .ms-finish .ms-date { color: var(--success); font-weight: 700; }
  .brief-section.brief-done { border-left-color: var(--success); }
  .brief-done .brief-head > :not(.brief-count) { filter: grayscale(1); opacity: .55; }
  .brief-done .brief-count { color: var(--success); }
  .task.row-overdue { background: var(--row-overdue); box-shadow: inset 4px 0 0 var(--danger); }
  .task-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .task-title { min-width: 0; flex: 1 1 320px; }
  .task-title strong { color: var(--heading); font-size: 15px; }
  .rev-banner { margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; background: var(--danger-soft); color: var(--danger); }
  .task-notes { margin-top: 8px; font-size: 13px; max-width: none; }
  .task-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .task-actions .row-actions { flex-direction: row; flex-wrap: wrap; }

  /* Timeline: one column per step, connected by a line; scrolls sideways on small screens */
  .stepper-wrap { overflow-x: auto; margin-top: 14px; padding-bottom: 4px; }
  .stepper { display: flex; list-style: none; }
  .ms-step { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; flex: 1 0 90px; padding: 0 4px; font-size: 11px; color: var(--muted); }
  .ms-step::before { content: ""; position: absolute; top: 14px; right: 50%; width: 100%; height: 3px; background: var(--border); z-index: 0; }
  .ms-step:first-child::before { display: none; }
  .ms-done::before, .ms-current::before { background: var(--success); }
  .ms-step .dot { position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: var(--card-bg); border: 2px solid var(--border); color: var(--muted); margin-bottom: 6px; }
  .ms-qc .dot { border-radius: 8px; font-size: 9px; }
  .ms-done .dot { background: var(--success); border-color: var(--success); color: #fff; }
  .ms-current .dot { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
  .ms-finish .dot { font-size: 14px; }
  .ms-name { font-weight: 700; color: var(--text); line-height: 1.3; }
  .ms-current .ms-name { color: var(--accent); }
  .ms-todo .ms-name { color: var(--muted); }
  .ms-owner { line-height: 1.3; font-weight: 400; }
  .ms-date { min-height: 1.3em; font-weight: 600; }
  .ms-current .ms-date { color: var(--accent); }
  /* An open revision: the steps being redone are red until the QC step that asked for it approves again */
  .ms-red:not(.ms-red-start)::before { background: var(--danger); }
  .ms-red .dot { border-color: var(--danger); color: var(--danger); }
  .ms-red.ms-done .dot, .ms-red.ms-current .dot { background: var(--danger); border-color: var(--danger); color: #fff; }
  .ms-red.ms-current .dot { box-shadow: 0 0 0 4px var(--danger-soft); }
  .ms-red .ms-name, .ms-red.ms-current .ms-date { color: var(--danger); }
  .rev { color: var(--danger); }

  /* Event Attribute deliverables */
  .checklist { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel-bg); border: 1px solid var(--border); font-size: 12px; box-shadow: var(--box-shadow); }
  .checklist-head { font-weight: 600; color: var(--muted); margin-right: 4px; }
  .check-item { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; }
  .check-item input { width: 14px; height: 14px; }
  .check-item.on { border-color: var(--success); color: var(--success); font-weight: 600; }

  .history { margin-top: 10px; font-size: 13px; }
  .history summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12px; }
  .history ul { list-style: none; margin-top: 8px; border-left: 2px solid var(--border); padding-left: 12px; }
  .history li { margin-bottom: 6px; }
  .history .note { color: var(--muted); font-style: italic; margin-top: 2px; }

  /* Below this width the columns get too narrow, so every row becomes a card instead */
  /* Footer credit: small, on the page background under the card */
  .credit { text-align: center; padding: 8px 16px 24px; font-size: 12px; }
  .credit a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 999px; transition: color .2s, background .2s; }
  .credit strong { font-weight: 600; color: var(--text); transition: color .2s; }
  .credit a:hover { background: var(--primary-soft); }
  .credit a:hover strong { color: var(--accent); }

  /* ---------- Motion: short and subtle; switched off for people who prefer less motion ---------- */
  @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 var(--ring); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  @keyframes dot-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes line-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes tick { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .view-in { animation: fade-up .3s ease-out; }
  .modal-bg.show { animation: fade-in .2s ease-out; }
  .history[open] ul { animation: fade-up .25s ease-out; }
  .rev-banner { animation: fade-in .3s ease-out; }
  /* Hover: buttons and cards lift a little */
  button:not(:disabled):hover, .btn:hover { transform: translateY(-1px); }
  .tabs button:hover, .segmented button:hover, .pin:hover, .reset-link:hover { transform: none; }
  .pin:hover { transform: scale(1.15); }
  .tabs button { transition: background .2s, color .2s, border-color .25s; }
  .task, .group-item { transition: background .2s; }
  .task:not(.row-overdue):hover, .group-item:not(.row-overdue):not(.row-pinned):hover { background: color-mix(in srgb, var(--panel-bg) 55%, transparent); }
  .check-item { transition: border-color .2s, color .2s, background .2s, transform .15s; }
  .check-item:hover { border-color: var(--accent); }
  .check-item.just-ticked { animation: tick .35s ease-out; }
  .chip, .tag-link, a.main-link { transition: color .2s, border-color .2s; }
  /* Timeline: the current step breathes; hovering a step lifts its dot; a step just reached pops in */
  .ms-step .dot { transition: transform .2s, background .3s, border-color .3s; }
  .ms-step:hover .dot { transform: scale(1.1); }
  .ms-current .dot { --ring: color-mix(in srgb, var(--accent) 45%, transparent); animation: ring 2s ease-out infinite; }
  .ms-red.ms-current .dot { --ring: color-mix(in srgb, var(--danger) 45%, transparent); }
  .task-moved .ms-current .dot, .task-moved .ms-finish.ms-done .dot { animation: dot-pop .4s ease-out, ring 2s ease-out .4s infinite; }
  .task-moved .ms-current::before, .task-moved .ms-finish.ms-done::before { transform-origin: left center; animation: line-fill .45s ease-out; }
  .task-moved .ms-current .ms-name, .task-moved .ms-current .ms-date { animation: fade-in .4s ease-out; }
  /* Logins: who is logged in, the owner's View as banner and Admin tab */
  .view-as-banner { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 16px; font-size: 13px; color: #fff; background: #4f46e5; }
  .view-as-banner button { background: rgba(255, 255, 255, .2); color: #fff; }
  .view-as-banner button:hover { background: rgba(255, 255, 255, .35); }
  .waiting { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
  .waiting b { color: var(--heading); }
  /* View as: whatever would change data is hidden (the server refuses it anyway) */
  body.read-only #submitBtn, body.read-only .task-create, body.read-only .link-create, body.read-only #results [data-act="edit"], body.read-only #results [data-act="delete"], body.read-only #results [data-act="pin"] { display: none; }
